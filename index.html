<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="./manifest.json">
<title>廣東話 Cantonese Learner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f7f3ee; min-height: 100vh; padding-bottom: 70px; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }

  /* Hamburger menu */
  .hamburger { background: transparent; border: none; cursor: pointer; padding: 4px; display: flex; flex-direction: column; gap: 5px; }
  .hamburger span { display: block; width: 22px; height: 2px; background: #e8c97e; border-radius: 2px; transition: all 0.2s; }
  .nav-drawer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; display: none; }
  .nav-drawer.open { display: block; }
  .nav-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
  .nav-panel { position: absolute; top: 0; right: 0; width: 240px; height: 100%; background: #1a1a2e; padding: 0; display: flex; flex-direction: column; box-shadow: -4px 0 24px rgba(0,0,0,0.3); }
  .nav-panel-header { padding: 20px 20px 16px; border-bottom: 1px solid #2e2e4e; display: flex; align-items: center; justify-content: space-between; }
  .nav-panel-title { font-size: 13px; color: #e8c97e; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .nav-close { background: transparent; border: none; color: #aaa; font-size: 20px; cursor: pointer; padding: 0; line-height: 1; }
  .nav-item { display: flex; align-items: center; gap: 14px; padding: 16px 20px; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; transition: background 0.15s; border-bottom: 1px solid #2e2e4e22; }
  .nav-item:hover { background: #252540; }
  .nav-item.active { background: #252540; }
  .nav-item .ni-icon { font-size: 22px; }
  .nav-item .ni-text { display: flex; flex-direction: column; gap: 2px; }
  .nav-item .ni-label { font-size: 15px; font-weight: 700; color: #fff; }
  .nav-item .ni-desc { font-size: 11px; color: #666; }
  .nav-item.active .ni-label { color: #e8c97e; }
  .nav-item .ni-tick { margin-left: auto; color: #e8c97e; font-size: 16px; opacity: 0; }
  .nav-item.active .ni-tick { opacity: 1; }

  /* Header */
  .header { background: #1a1a2e; padding: 16px 20px 12px; position: sticky; top: 0; z-index: 10; }
  .header-title { display: flex; align-items: baseline; gap: 10px; }
  .header-title .zh { font-size: 24px; color: #e8c97e; }
  .header-title .en { font-size: 11px; color: #aaa; letter-spacing: 2px; text-transform: uppercase; }
  .tone-key { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .tone-key span { font-size: 11px; font-weight: 700; }
  .tone-key .label { color: #555; font-weight: 400; }

  /* Voice banner */
  .voice-banner { margin: 10px 20px 0; padding: 8px 14px; border-radius: 10px; font-size: 11px; display: flex; align-items: center; gap: 6px; }
  .voice-ok  { background: #eafaf1; border: 1px solid #27AE60; color: #1E8449; }
  .voice-warn{ background: #fef9e7; border: 1px solid #F0B27A; color: #935116; }
  .voice-none{ background: #fdedec; border: 1px solid #E74C3C; color: #922B21; }

  /* Topic pills */
  .topics { display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 6px; scrollbar-width: none; }
  .topic-btn { flex-shrink: 0; padding: 7px 13px; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 600; border: 2px solid #ddd; background: #fff; color: #555; white-space: nowrap; transition: all 0.18s; }
  .topic-btn.active { color: #fff; }

  /* Content */
  .content { padding: 12px 20px 40px; max-width: 680px; margin: 0 auto; }
  .lesson-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .lesson-title { font-size: 20px; font-weight: 700; margin: 0; }
  .lesson-count { font-size: 12px; color: #999; margin-top: 2px; }
  .mode-btn { padding: 7px 16px; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 700; transition: all 0.15s; }
  .hint { font-size: 11px; color: #aaa; margin-bottom: 12px; }

  /* Word grid */
  .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; }

  /* Word card */
  .word-card { cursor: pointer; border-radius: 14px; padding: 24px 14px 14px; min-height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; position: relative; transition: background 0.2s, box-shadow 0.2s; border: 2px solid; user-select: none; }
  .card-chinese { font-size: 34px; color: #1a1a2e; line-height: 1.2; }
  .card-jyutping { font-size: 12px; margin-top: 2px; }
  .card-hint { font-size: 11px; color: #bbb; margin-top: 1px; }
  .card-english { font-size: 15px; font-weight: 700; color: #fff; text-align: center; padding: 0 8px; }
  .speak-btn { position: absolute; top: 6px; right: 6px; width: 54px; height: 54px; border-radius: 50%; cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  @keyframes pulse { from { opacity:1; } to { opacity:0.4; } }
  .speaking { animation: pulse 0.6s infinite alternate; }

  /* Home screen — categorised topic cards */
  .home-wrap { padding: 12px 20px 32px; max-width: 760px; margin: 0 auto; }
  .home-header { margin-bottom: 14px; }
  .home-title { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
  .home-subtitle { font-size: 12px; color: #999; }

  .cat-filter-wrap { margin-bottom: 14px; }
  .cat-filter-select { width: 100%; padding: 12px 36px 12px 14px; font-size: 14px; font-weight: 600; color: #1a1a2e; background: #fff; border: 2px solid #ddd; border-radius: 12px; cursor: pointer; appearance: none; -webkit-appearance: none; -moz-appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231a1a2e'><path d='M7 10l5 5 5-5z'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; background-size: 22px; font-family: inherit; }
  .cat-filter-select:focus { outline: none; border-color: #1a1a2e; }

  .cat-section { margin-bottom: 24px; }
  .cat-section-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; padding: 0 4px; }
  .cat-section-title { font-size: 14px; font-weight: 700; color: #1a1a2e; }
  .cat-section-count { font-size: 11px; color: #aaa; font-weight: 600; }

  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .topic-card { cursor: pointer; border-radius: 14px; padding: 16px 14px; background: #fff; border: 2px solid; min-height: 100px; display: flex; flex-direction: column; gap: 4px; transition: all 0.15s; position: relative; user-select: none; }
  .topic-card:active { transform: scale(0.97); }
  .topic-card-icon { font-size: 28px; line-height: 1; margin-bottom: 4px; }
  .topic-card-label { font-size: 14px; font-weight: 700; color: #1a1a2e; line-height: 1.2; }
  .topic-card-meta { font-size: 11px; color: #888; margin-top: auto; }
  .topic-card-rounds { display: flex; gap: 3px; margin-top: 4px; }
  .topic-card-pip { width: 6px; height: 6px; border-radius: 50%; }

  /* Round selector inside topic page */
  .round-selector { display: flex; gap: 6px; margin-bottom: 12px; align-items: center; }
  .round-label { font-size: 11px; color: #888; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-right: 4px; }
  .round-btn { padding: 5px 12px; border-radius: 16px; border: 2px solid; background: #fff; cursor: pointer; font-size: 12px; font-weight: 700; transition: all 0.15s; }
  .round-btn.active { color: #fff; }

  /* Back-to-home button */
  .back-home-btn { display: inline-flex; align-items: center; gap: 5px; background: transparent; border: none; color: #888; font-size: 13px; cursor: pointer; padding: 4px 0; margin-bottom: 8px; font-weight: 600; }
  .back-home-btn:hover { color: #1a1a2e; }

  /* Translate */
  .translate-wrap { padding: 16px 20px 32px; max-width: 680px; margin: 0 auto; }
  .translate-header { margin-bottom: 16px; }
  .translate-header h2 { font-size: 20px; font-weight: 700; color: #2C3E7A; margin-bottom: 4px; }
  .translate-header p { font-size: 12px; color: #999; }
  .translate-input-wrap { background: #fff; border-radius: 14px; padding: 14px; border: 1px solid #eee; margin-bottom: 12px; }
  .translate-input { width: 100%; min-height: 60px; border: none; outline: none; font-size: 16px; font-family: inherit; resize: vertical; color: #1a1a2e; background: transparent; }
  .translate-input::placeholder { color: #bbb; }
  .translate-input-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f4f0eb; }
  .translate-mic { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid #2C3E7A; background: transparent; color: #2C3E7A; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .translate-mic.listening { background: #E74C3C; border-color: #E74C3C; color: #fff; animation: micPulse 1s infinite; }
  .translate-direction-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; padding: 8px 14px; background: #fff; border-radius: 30px; border: 1px solid #eee; }
  .translate-dir-label { font-size: 13px; font-weight: 700; color: #2C3E7A; padding: 4px 10px; border-radius: 16px; }
  .translate-dir-label.muted { color: #aaa; font-weight: 500; }
  .translate-dir-swap { background: #2C3E7A; border: none; cursor: pointer; font-size: 16px; color: #fff; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(44,62,122,0.3); transition: all 0.15s; flex-shrink: 0; }
  .translate-dir-swap:active { transform: scale(0.92); }
  .translate-listening-hint { font-size: 11px; color: #E74C3C; font-weight: 700; margin-top: 6px; text-align: center; animation: pulse 0.6s infinite alternate; }
  .translate-go { flex: 1; padding: 10px 18px; background: #2C3E7A; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .translate-go:disabled { opacity: 0.5; cursor: default; }
  .translate-clear { padding: 10px 14px; background: transparent; color: #888; border: 1px solid #ddd; border-radius: 10px; font-size: 13px; cursor: pointer; }
  .translate-loading { padding: 30px 16px; text-align: center; color: #888; font-size: 13px; }
  .translate-error { background: #fde8ea; border: 1px solid #E74C3C; color: #7b1c1c; padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
  .translate-result { background: #fff; border-radius: 14px; padding: 16px 18px; border: 2px solid #2C3E7A22; }
  .translate-zh { font-size: 22px; line-height: 1.4; color: #1a1a2e; margin-bottom: 8px; }
  .translate-jp { font-size: 14px; margin-bottom: 8px; }
  .translate-result-actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f4f0eb; }
  .translate-action-btn { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1.5px solid #2C3E7A; background: transparent; color: #2C3E7A; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .translate-action-btn.primary { background: #2C3E7A; color: #fff; }

  /* API key setup */
  .apikey-setup { background: #fff; border-radius: 14px; padding: 22px 18px; border: 2px dashed #2C3E7A; margin-bottom: 16px; text-align: center; }
  .apikey-setup h3 { font-size: 16px; color: #2C3E7A; margin-bottom: 8px; }
  .apikey-setup p { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 12px; }
  .apikey-setup small { color: #aaa; font-size: 11px; }
  .apikey-input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; font-family: monospace; margin-bottom: 10px; box-sizing: border-box; }
  .apikey-save { padding: 10px 18px; background: #2C3E7A; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; }
  .apikey-toggle-row { display: flex; justify-content: flex-end; margin-top: 6px; }
  .apikey-toggle-btn { background: transparent; border: none; color: #999; font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline; }

  /* Patterns section */
  .patterns-header { padding: 16px 20px 0; max-width: 680px; margin: 0 auto; }
  .patterns-header h2 { font-size: 20px; font-weight: 700; color: #2C3E7A; margin-bottom: 4px; }
  .patterns-header p { font-size: 12px; color: #999; margin-bottom: 16px; }
  .pattern-card { background: #fff; border-radius: 16px; margin: 0 20px 14px; border: 1px solid #eee; overflow: hidden; max-width: 680px; }
  .pattern-head { padding: 14px 16px 12px; background: #2C3E7A; }
  .pattern-number { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
  .pattern-label { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .pattern-structure { display: inline-block; background: rgba(255,255,255,0.12); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: rgba(255,255,255,0.85); font-family: monospace; }
  .pattern-body { padding: 12px 16px 14px; }
  .pattern-note { font-size: 12px; color: #888; margin-bottom: 12px; line-height: 1.5; font-style: italic; }
  .pattern-examples { display: flex; flex-direction: column; gap: 8px; }
  .pattern-example { display: flex; align-items: center; gap: 10px; background: #f7f3ee; border-radius: 10px; padding: 10px 12px; }
  .pattern-ex-text { flex: 1; }
  .pattern-ex-zh { font-size: 17px; color: #1a1a2e; margin-bottom: 3px; line-height: 1.3; }
  .pattern-ex-jp { font-size: 12px; margin-bottom: 3px; }
  .pattern-ex-en { font-size: 11px; color: #888; }
  .pattern-ex-play { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #2C3E7A; background: transparent; color: #2C3E7A; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .pattern-ex-play.speaking { background: #2C3E7A; color: #fff; animation: pulse 0.6s infinite alternate; }

  /* Sentences */
  .sentences { margin-top: 28px; }
  .sentences h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #1a1a2e; }
  .sentence-card { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid #eee; display: flex; align-items: flex-start; gap: 12px; }
  .sentence-body { flex: 1; }
  .sentence-chinese { font-size: 17px; color: #1a1a2e; margin-bottom: 4px; line-height: 1.4; }
  .sentence-jyutping { font-size: 12px; margin-bottom: 4px; }
  .sentence-english { font-size: 12px; color: #888; }
  .sentence-play { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; border: 1.5px solid; background: transparent; margin-top: 2px; }

  .bubble-row.right .bubble .bubble-jyutping span { color: rgba(255,255,255,0.88) !important; }

  /* Sub-tabs (Words | Conversation) */
  .subtabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .subtab-btn { flex: 1; padding: 8px 10px; border-radius: 10px; border: 2px solid #ddd; background: #fff; color: #888; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; text-align: center; }
  .subtab-btn.active { color: #fff; border-color: transparent; }

  /* Conversation */
  .convo-scenario { font-size: 12px; color: #888; margin-bottom: 14px; font-style: italic; }
  .convo-controls { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .convo-ctrl-btn { padding: 7px 14px; border-radius: 20px; border: 2px solid #ddd; background: #fff; color: #555; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .convo-ctrl-btn.on { color: #fff; border-color: transparent; }
  .bubble-row { display: flex; margin-bottom: 14px; }
  .bubble-row.left  { justify-content: flex-start; }
  .bubble-row.right { justify-content: flex-end; }
  .bubble-wrap { max-width: 80%; }
  .bubble-name { font-size: 10px; color: #aaa; margin-bottom: 3px; padding: 0 4px; }
  .bubble-row.right .bubble-name { text-align: right; }
  .bubble { border-radius: 16px; padding: 12px 14px; position: relative; }
  .bubble-row.left  .bubble { background: #fff; border: 1px solid #eee; border-bottom-left-radius: 4px; }
  .bubble-row.right .bubble { border-bottom-right-radius: 4px; color: #fff; }
  .bubble-chinese  { font-size: 17px; line-height: 1.4; margin-bottom: 4px; }
  .bubble-jyutping { font-size: 11px; margin-bottom: 3px; }
  .bubble-english  { font-size: 11px; opacity: 0.75; }
  .bubble-play-row { display: flex; justify-content: flex-end; margin-top: 8px; }
  .bubble-row.left .bubble-play-row { justify-content: flex-start; }
  .bubble-play { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid; background: transparent; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .gap-prompt { font-size: 12px; color: #888; margin-bottom: 8px; font-style: italic; }
  .gap-options { display: flex; flex-direction: column; gap: 7px; }
  .gap-btn { padding: 10px 14px; border-radius: 10px; border: 2px solid #ddd; background: #fff; color: #1a1a2e; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; transition: all 0.15s; }
  .gap-btn.correct { background: #d4edda; border-color: #27AE60; color: #1a5e2a; }
  .gap-btn.wrong   { background: #fde8ea; border-color: #E74C3C; color: #7b1c1c; }
  .gap-btn:disabled { cursor: default; }

  /* Speak mode */
  .speak-card { background: #fff; border-radius: 16px; padding: 24px 20px; border: 3px solid; margin-bottom: 16px; text-align: center; }
  .speak-prompt { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
  .speak-target-zh { font-size: 28px; line-height: 1.3; margin-bottom: 8px; color: #1a1a2e; }
  .speak-target-jp { font-size: 14px; margin-bottom: 6px; }
  .speak-target-en { font-size: 12px; color: #888; margin-bottom: 18px; }
  .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: none; font-size: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; transition: all 0.2s; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
  .mic-btn.idle { background: #fff; }
  .mic-btn.listening { animation: micPulse 1s infinite; box-shadow: 0 0 0 0 currentColor; }
  @keyframes micPulse { 0% { box-shadow: 0 0 0 0 rgba(231,76,60,0.6); } 100% { box-shadow: 0 0 0 18px rgba(231,76,60,0); } }
  .speak-status { font-size: 13px; color: #888; min-height: 20px; margin-bottom: 14px; }
  .speak-heard { background: #f7f3ee; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 18px; color: #1a1a2e; }
  .speak-result-good { background: #d4edda; border: 2px solid #27AE60; color: #1a5e2a; padding: 12px 16px; border-radius: 10px; font-weight: 700; margin-bottom: 14px; }
  .speak-result-bad  { background: #fde8ea; border: 2px solid #E74C3C; color: #7b1c1c; padding: 12px 16px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
  .speak-breakdown { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; margin-top: 10px; padding: 10px; background: #fff; border-radius: 8px; }
  .speak-breakdown .bd-col { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 32px; }
  .speak-breakdown .bd-char { font-size: 20px; font-weight: 700; line-height: 1; }
  .speak-breakdown .bd-status { font-size: 13px; line-height: 1; }
  .speak-breakdown .bd-jp { font-size: 11px; line-height: 1; white-space: nowrap; }
  .speak-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .speak-action-btn { padding: 9px 20px; border-radius: 20px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; }
  .speak-unsupported { padding: 30px 20px; text-align: center; background: #fef9e7; border: 1px solid #F0B27A; border-radius: 12px; color: #935116; font-size: 13px; line-height: 1.6; }

  .speak-nav { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #aaa; margin-bottom: 12px; }

  /* Breakdown panel */
  .breakdown-panel { margin-top: 8px; background: #f7f3ee; border-radius: 10px; padding: 10px 12px; border: 1px solid #e8e4df; }
  .breakdown-row { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px solid #eee; }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-zh { font-size: 16px; color: #1a1a2e; min-width: 36px; }
  .breakdown-jp { font-size: 12px; flex: 1; }
  .breakdown-en { font-size: 11px; color: #888; text-align: right; }
  .breakdown-btn { display: flex; align-items: center; gap: 4px; margin-top: 6px; background: transparent; border: none; cursor: pointer; font-size: 11px; font-weight: 700; padding: 0; }

  /* Bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2e; display: flex; border-top: 1px solid #2e2e4e; z-index: 20; }

<div id="app"></div>

<script>
// ── Data Store ──────────────────────────────────────────────────────────────
// All content lives in /data/ as JSON. The store loads reference data on init
// and lazy-loads per-topic JSON on demand, caching in memory.
const store = {
  index:           null,   // [ {key, label, icon, color, rounds} ]
  categoryList:    null,   // [ {key, label, icon} ]
  topicCategories: null,   // { greetings: 'everyday', ... }
  paths:           null,   // [ {key, label, ..., lessons} ]
  topicCache:      {},     // { greetings: {meta, rounds}, ... }

  // Index lookups — synchronous after init
  indexEntry(key) { return (this.index || []).find(t => t.key === key); },
  availableRounds(key) {
    const e = this.indexEntry(key);
    return e ? e.rounds.slice() : [1];
  },
  topicsByCategory(catKey) {
    if (!this.topicCategories) return [];
    return Object.keys(this.topicCategories).filter(t => this.topicCategories[t] === catKey);
  },

  // Topic metadata — falls back to index entry when topic file not yet loaded
  topicMeta(key) {
    const cached = this.topicCache[key];
    if (cached) return cached.meta;
    const e = this.indexEntry(key);
    return e ? { label: e.label, icon: e.icon, color: e.color } : null;
  },

  // Topic content — must be loaded first; returns null otherwise
  isTopicLoaded(key) { return !!this.topicCache[key]; },
  roundData(key, round) {
    const t = this.topicCache[key];
    return t ? (t.rounds[String(round)] || null) : null;
  },

  // Reference-data loaders (called once on init)
  async loadIndex() {
    const r = await fetch('./data/topics_index.json');
    this.index = (await r.json()).topics;
  },
  async loadCategories() {
    const r = await fetch('./data/categories.json');
    const j = await r.json();
    this.categoryList = j.list;
    this.topicCategories = j.topic_map;
  },
  async loadPaths() {
    const r = await fetch('./data/learning_paths.json');
    this.paths = (await r.json()).paths;
  },

  // Topic loader (cached) — returns the cached topic object
  async loadTopic(key) {
    if (this.topicCache[key]) return this.topicCache[key];
    const r = await fetch('./data/topics/' + key + '.json');
    if (!r.ok) throw new Error('Topic ' + key + ' failed to load: ' + r.status);
    const j = await r.json();
    this.topicCache[key] = j;
    return j;
  },

  // Convenience: load several topics in parallel
  async loadTopics(keys) {
    await Promise.all(keys.filter(k => !this.topicCache[k]).map(k => this.loadTopic(k)));
  },
};

// ── Round accessors — single point of truth for "what content is in topic+round" ──
// These assume the topic has been loaded; return safe defaults otherwise.
function getAvailableRounds(topic) {
  return store.availableRounds(topic);
}
function getRoundWords(topic, round) {
  return store.roundData(topic, round)?.words || [];
}
function getRoundSentences(topic, round) {
  return store.roundData(topic, round)?.sentences || [];
}
function getRoundConvo(topic, round) {
  return store.roundData(topic, round)?.convo || null;
}
function getRoundNote(topic, round) {
  return store.roundData(topic, round)?.note || null;
}
function getTopicsByCategory(categoryKey) {
  return store.topicsByCategory(categoryKey);
}

// ── Lesson shape helper ──
// Synthesises the legacy { label, icon, color, words, note } object that the
// existing render functions expect, drawn from the cached topic file.
// Falls back to index metadata if topic file isn't loaded yet.
function lessonShape(key) {
  const meta = store.topicMeta(key);
  if (!meta) return { label: '', icon: '', color: '#888', words: [], note: null };
  const r1 = store.roundData(key, 1) || {};
  return {
    label: meta.label,
    icon:  meta.icon,
    color: meta.color,
    words: r1.words || [],
    note:  r1.note  || null,
  };
}

const TONES = {
  "1":{"color":"#E74C3C","desc":"High level",  "ex":"詩 si1"},
  "2":{"color":"#E67E22","desc":"High rising", "ex":"史 si2"},
  "3":{"color":"#c8a200","desc":"Mid level",   "ex":"試 si3"},
  "4":{"color":"#27AE60","desc":"Low falling", "ex":"時 si4"},
  "5":{"color":"#2980B9","desc":"Low rising",  "ex":"市 si5"},
  "6":{"color":"#8E44AD","desc":"Low level",   "ex":"事 si6"},
};

// ── Patterns ──────────────────────────────────────────────────────────────────
const PATTERNS = [
  { label:"I want to…",              structure:"ngo5 soeng2 + [verb]",
    note:"The most useful starter — attach any verb to express what you want to do.",
    examples:[{c:"我想食",j:"ngo5 soeng2 sik6",e:"I want to eat"},{c:"我想飲茶",j:"ngo5 soeng2 jam2 caa4",e:"I want to drink tea"},{c:"我想去",j:"ngo5 soeng2 heoi3",e:"I want to go"}]},
  { label:"I'll have / I need…",     structure:"ngo5 jiu3 + [noun]",
    note:"Use for ordering food, asking for things, or stating what you need.",
    examples:[{c:"我要水",j:"ngo5 jiu3 seoi2",e:"I need water"},{c:"我要三個",j:"ngo5 jiu3 saam1 go3",e:"I'll take three"},{c:"我要呢個",j:"ngo5 jiu3 ni1 go3",e:"I want this one"}]},
  { label:"Do you have…?",           structure:"jau5 mou5 + [noun]?",
    note:"A very natural way to ask about availability — literally 'have or not have?'",
    examples:[{c:"有冇茶？",j:"jau5 mou5 caa4?",e:"Do you have tea?"},{c:"有冇折？",j:"jau5 mou5 zit3?",e:"Is there a discount?"},{c:"有冇平啲？",j:"jau5 mou5 peng4 di1?",e:"Is there a cheaper one?"}]},
  { label:"Where is…?",              structure:"[noun] + hai2 bin1 dou6?",
    note:"Put the thing you're looking for at the start, then ask where it is.",
    examples:[{c:"洗手間喺邊度？",j:"sai2 sau2 gaan1 hai2 bin1 dou6?",e:"Where is the bathroom?"},{c:"地鐵站喺邊度？",j:"dei6 tit3 zaam6 hai2 bin1 dou6?",e:"Where is the MTR station?"},{c:"呢個喺邊度？",j:"ni1 go3 hai2 bin1 dou6?",e:"Where is this?"}]},
  { label:"How much?",               structure:"gei2 cin2?",
    note:"Works alone or after pointing at something. Add ni1 go3 (this one) for clarity.",
    examples:[{c:"幾錢？",j:"gei2 cin2?",e:"How much?"},{c:"呢個幾錢？",j:"ni1 go3 gei2 cin2?",e:"How much is this one?"},{c:"大概幾錢？",j:"daai6 koi3 gei2 cin2?",e:"Approximately how much?"}]},
  { label:"Please give me…",         structure:"m4 goi1 bei2 + [noun] + ngo5",
    note:"Very common in restaurants and shops. Note how 'me' comes at the end.",
    examples:[{c:"唔該俾杯茶我",j:"m4 goi1 bei2 bui1 caa4 ngo5",e:"Please give me a cup of tea"},{c:"唔該俾個袋我",j:"m4 goi1 bei2 go3 doi2 ngo5",e:"Please give me a bag"},{c:"唔該俾筷子我",j:"m4 goi1 bei2 faai3 zi2 ngo5",e:"Please give me chopsticks"}]},
  { label:"Very…",                   structure:"hou2 + [adjective]",
    note:"hou2 intensifies any adjective. Stack it for extra emphasis — hou2 hou2 means 'very very good'.",
    examples:[{c:"好熱",j:"hou2 jit6",e:"Very hot"},{c:"好味",j:"hou2 mei6",e:"Very delicious"},{c:"好貴",j:"hou2 gwai3",e:"Very expensive"},{c:"好好",j:"hou2 hou2",e:"Very good"}]},
  { label:"Not / Don't…",            structure:"m4 + [verb or adjective]",
    note:"m4 is the general negation particle. Place it directly before the verb or adjective.",
    examples:[{c:"我唔明",j:"ngo5 m4 ming4",e:"I don't understand"},{c:"唔貴",j:"m4 gwai3",e:"Not expensive"},{c:"我唔要",j:"ngo5 m4 jiu3",e:"I don't want it"},{c:"唔係",j:"m4 hai6",e:"That's not right"}]},
  { label:"Yes/no question",         structure:"[statement] + maa3?",
    note:"Add maa3 to the end of any statement to turn it into a yes/no question.",
    examples:[{c:"你好嗎？",j:"nei5 hou2 maa3?",e:"Are you well?"},{c:"貴嗎？",j:"gwai3 maa3?",e:"Is it expensive?"},{c:"你識講廣東話嗎？",j:"nei5 sik1 gong2 gwong2 dung1 waa6 maa3?",e:"Do you speak Cantonese?"}]},
  { label:"What would you like to…?",structure:"soeng2 + [verb] + di1 me1?",
    note:"A polite way to ask what someone wants — common in service situations.",
    examples:[{c:"想食啲咩？",j:"soeng2 sik6 di1 me1?",e:"What would you like to eat?"},{c:"想飲啲咩？",j:"soeng2 jam2 di1 me1?",e:"What would you like to drink?"},{c:"想買啲咩？",j:"soeng2 maai5 di1 me1?",e:"What would you like to buy?"}]},
  { label:"I feel…",                 structure:"ngo5 gok3 dak1 + [adjective]",
    note:"Use this to describe how you're feeling physically or emotionally.",
    examples:[{c:"我覺得好攰",j:"ngo5 gok3 dak1 hou2 gui6",e:"I feel very tired"},{c:"我覺得好凍",j:"ngo5 gok3 dak1 hou2 dung3",e:"I feel very cold"},{c:"我覺得唔舒服",j:"ngo5 gok3 dak1 m4 syu1 fuk6",e:"I feel unwell"}]},
  { label:"Going to…",               structure:"heoi3 + [place]",
    note:"Simple and direct. Works for saying where you're going or asking where to go.",
    examples:[{c:"去中環",j:"heoi3 zung1 waan4",e:"Going to Central"},{c:"去邊度？",j:"heoi3 bin1 dou6?",e:"Where are you going?"},{c:"我去超市",j:"ngo5 heoi3 ciu1 si5",e:"I'm going to the supermarket"}]},
  { label:"See you at / on…",        structure:"[time] + gin3",
    note:"Put any time word before gin3 to arrange when to meet.",
    examples:[{c:"聽日見",j:"ting1 jat6 gin3",e:"See you tomorrow"},{c:"朝早見",j:"ziu1 zou2 gin3",e:"See you in the morning"},{c:"星期六見",j:"sing1 kei4 luk6 gin3",e:"See you Saturday"}]},
  { label:"Is that ok / Can I?",     structure:"dak1 m4 dak1?",
    note:"Literally 'ok or not ok?' — use to seek permission or check if something works.",
    examples:[{c:"咁得唔得？",j:"gam2 dak1 m4 dak1?",e:"Is this ok?"},{c:"我坐喺呢度得唔得？",j:"ngo5 co5 hai2 ni1 dou6 dak1 m4 dak1?",e:"Can I sit here?"},{c:"而家去得唔得？",j:"ji4 gaa1 heoi3 dak1 m4 dak1?",e:"Can we go now?"}]},
  { label:"Too…!",                   structure:"taai3 + [adjective] + laa3",
    note:"Express that something is excessive. laa3 adds a sense of finality or mild complaint.",
    examples:[{c:"太貴喇",j:"taai3 gwai3 laa3",e:"Too expensive!"},{c:"太熱喇",j:"taai3 jit6 laa3",e:"Too hot!"},{c:"太多喇",j:"taai3 do1 laa3",e:"Too much!"}]},
  { label:"Can I / May I…?",         structure:"ho2 m4 ho2 ji5 + [verb]?",
    note:"A polite way to ask permission — more formal than dak1 m4 dak1.",
    examples:[{c:"可唔可以講慢啲？",j:"ho2 m4 ho2 ji5 gong2 maan6 di1?",e:"Can you speak more slowly?"},{c:"可唔可以睇吓？",j:"ho2 m4 ho2 ji5 tai2 haa5?",e:"Can I take a look?"},{c:"可唔可以等我？",j:"ho2 m4 ho2 ji5 dang2 ngo5?",e:"Can you wait for me?"}]},
  { label:"What is…?",               structure:"[noun] + hai6 mat1 je5?",
    note:"Use when you want to know what something is called or what something means.",
    examples:[{c:"呢個係咩嘢？",j:"ni1 go3 hai6 mat1 je5?",e:"What is this?"},{c:"呢個字係咩嘢？",j:"ni1 go3 zi6 hai6 mat1 je5?",e:"What does this word mean?"},{c:"果個係咩嘢？",j:"go2 go3 hai6 mat1 je5?",e:"What is that?"}]},
  { label:"Why…?",                   structure:"dim2 gaai3 + [statement]?",
    note:"Place dim2 gaai3 at the start of any statement to turn it into a 'why' question.",
    examples:[{c:"點解咁貴？",j:"dim2 gaai3 gam3 gwai3?",e:"Why is it so expensive?"},{c:"點解唔去？",j:"dim2 gaai3 m4 heoi3?",e:"Why aren't you going?"},{c:"點解咁熱？",j:"dim2 gaai3 gam3 jit6?",e:"Why is it so hot?"}]},
  { label:"There's also… / And also…",structure:"zung6 jau5 + [noun/verb]",
    note:"Use to add something on top of what's already been said — great for ordering.",
    examples:[{c:"仲有茶",j:"zung6 jau5 caa4",e:"And also tea"},{c:"仲有一個",j:"zung6 jau5 jat1 go3",e:"One more"},{c:"仲有咩嘢？",j:"zung6 jau5 mat1 je5?",e:"What else is there?"}]},
  { label:"A bit more / less…",      structure:"[adjective] + di1",
    note:"Adding di1 after an adjective softens it — useful for polite requests.",
    examples:[{c:"慢啲",j:"maan6 di1",e:"A bit slower"},{c:"平啲",j:"peng4 di1",e:"A bit cheaper"},{c:"多啲",j:"do1 di1",e:"A bit more"},{c:"少啲",j:"siu2 di1",e:"A bit less"}]},
  { label:"I like…",                 structure:"ngo5 zung1 ji3 + [noun/verb]",
    note:"Express preferences for things, food, activities or people.",
    examples:[{c:"我鍾意食",j:"ngo5 zung1 ji3 sik6",e:"I like eating"},{c:"我鍾意茶",j:"ngo5 zung1 ji3 caa4",e:"I like tea"},{c:"我鍾意呢個",j:"ngo5 zung1 ji3 ni1 go3",e:"I like this one"}]},
  { label:"Give [someone] [something]",structure:"bei2 + [thing] + [person]",
    note:"bei2 means 'give' or 'let'. The person receiving comes at the end — opposite to English.",
    examples:[{c:"俾我",j:"bei2 ngo5",e:"Give me / let me"},{c:"俾佢睇",j:"bei2 keoi5 tai2",e:"Let him see it"},{c:"我俾你",j:"ngo5 bei2 nei5",e:"I'll give you"}]},
  { label:"I will…",                 structure:"ngo5 wui5 + [verb]",
    note:"Use wui5 to talk about future intentions or promises.",
    examples:[{c:"我會去",j:"ngo5 wui5 heoi3",e:"I will go"},{c:"我會記得",j:"ngo5 wui5 gei3 dak1",e:"I will remember"},{c:"我會打俾你",j:"ngo5 wui5 daa2 bei2 nei5",e:"I will call you"}]},
  { label:"Have never / Not yet done",structure:"mei6 + [verb] + gwo",
    note:"mei6...gwo expresses something you haven't experienced yet. Very useful for travel.",
    examples:[{c:"我未食過",j:"ngo5 mei6 sik6 gwo",e:"I've never eaten it"},{c:"我未去過",j:"ngo5 mei6 heoi3 gwo",e:"I've never been there"},{c:"我未見過",j:"ngo5 mei6 gin3 gwo",e:"I've never seen it"}]},
  { label:"Already done…",           structure:"[verb] + zo2 laa3",
    note:"zo2 marks completion — something has already happened. laa3 adds a sense of 'just now'.",
    examples:[{c:"食咗喇",j:"sik6 zo2 laa3",e:"Already eaten"},{c:"去咗喇",j:"heoi3 zo2 laa3",e:"Already gone"},{c:"買咗喇",j:"maai5 zo2 laa3",e:"Already bought it"}]},
  { label:"How long?",               structure:"gei2 noi6?",
    note:"Use to ask about duration — how long something takes or lasts.",
    examples:[{c:"幾耐？",j:"gei2 noi6?",e:"How long?"},{c:"要等幾耐？",j:"jiu3 dang2 gei2 noi6?",e:"How long do I have to wait?"},{c:"去幾耐？",j:"heoi3 gei2 noi6?",e:"How long does it take to get there?"}]},
  { label:"Together / Let's…",       structure:"jat1 cai4 + [verb]",
    note:"jat1 cai4 means 'together' — add it before any verb to suggest doing something jointly.",
    examples:[{c:"一齊去",j:"jat1 cai4 heoi3",e:"Let's go together"},{c:"一齊食",j:"jat1 cai4 sik6",e:"Let's eat together"},{c:"一齊啦",j:"jat1 cai4 laa1",e:"Come on, let's do it together"}]},
  { label:"First… then…",            structure:"sin1 + [verb]… zoi3 + [verb]",
    note:"sin1 means 'first' and zoi3 means 'then/again' — use them to sequence actions.",
    examples:[{c:"先食，再去",j:"sin1 sik6, zoi3 heoi3",e:"First eat, then go"},{c:"先講，再做",j:"sin1 gong2, zoi3 zou6",e:"First talk, then act"},{c:"先等我",j:"sin1 dang2 ngo5",e:"Wait for me first"}]},
  { label:"I think…",                structure:"ngo5 lam2 + [statement]",
    note:"ngo5 lam2 softly expresses an opinion or guess — less certain than stating a fact.",
    examples:[{c:"我諗係",j:"ngo5 lam2 hai6",e:"I think so"},{c:"我諗唔係",j:"ngo5 lam2 m4 hai6",e:"I don't think so"},{c:"我諗佢唔嚟",j:"ngo5 lam2 keoi5 m4 lai4",e:"I think he's not coming"}]},
  { label:"Wait a moment / Wait for…",structure:"dang2 + [person/time]",
    note:"dang2 means 'wait'. Use alone for 'wait a moment' or add who/how long to wait.",
    examples:[{c:"等我",j:"dang2 ngo5",e:"Wait for me"},{c:"等吓",j:"dang2 haa5",e:"Wait a moment"},{c:"等一陣",j:"dang2 jat1 zan6",e:"Wait a little while"}]},
];
// ── Audio ─────────────────────────────────────────────────────────────────────
let _voices = null;

function loadVoices() {
  return new Promise(resolve => {
    const v = window.speechSynthesis.getVoices();
    if (v.length > 0) { _voices = v; resolve(v); return; }
    const handler = () => {
      _voices = window.speechSynthesis.getVoices();
      resolve(_voices);
      window.speechSynthesis.removeEventListener('voiceschanged', handler);
    };
    window.speechSynthesis.addEventListener('voiceschanged', handler);
    setTimeout(() => { _voices = window.speechSynthesis.getVoices(); resolve(_voices); }, 2500);
  });
}

function pickVoicePair(voices) {
  const zh = voices.filter(v => v.lang === 'zh-HK' || v.lang === 'zh-TW' || v.lang.startsWith('zh'));
  if (zh.length === 0) return { a: null, b: null };
  const a = zh[0];
  // Prefer the 5th voice (index 4) as speaker B — user confirmed it's male on their device
  const b = zh[4] || zh.find(v => v !== a) || null;
  return { a, b };
}

async function speak(text, onEnd, voiceOverride, pitchOverride, langOverride) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const voices = _voices || await loadVoices();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = langOverride || 'zh-HK';
  const rates = { slow: 0.6, normal: 0.8, fast: 1.1 };
  utt.rate  = rates[state.speed] || 0.8;
  utt.pitch = pitchOverride !== undefined ? pitchOverride : 1.0;
  const { a } = pickVoicePair(voices);
  if (voiceOverride) utt.voice = voiceOverride;
  else if (a) utt.voice = a;
  if (onEnd) utt.onend = onEnd;
  window.speechSynthesis.speak(utt);
}

// Speak as a specific conversation speaker — uses subtle pitch variation
async function speakAs(text, isUser, onEnd) {
  const voices = _voices || await loadVoices();
  const { a } = pickVoicePair(voices);
  const pitch = isUser ? 0.85 : 1.1;
  speak(text, onEnd, a, pitch, 'zh-HK');
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function colorJyutping(text) {
  return text.split(' ').map(syl => {
    const tone = syl.match(/[1-6]/);
    const color = tone ? TONES[tone[0]].color : '#777';
    return `<span style="color:${color};font-weight:700;margin-right:3px">${syl}</span>`;
  }).join('');
}

function getQuizInitState(words) {
  const queue = shuffle(words).slice(0, Math.min(words.length, 8));
  return {
    queue,
    idx: 0,
    score: 0,
    selected: null,
    done: false,
    choices: buildChoices(queue[0], words),
  };
}

function buildChoices(answer, all) {
  const others = shuffle(all.filter(w => w.c !== answer.c)).slice(0, 3);
  return shuffle([...others, answer]);
}

function playAllConvo(lines, idx) {
  if (idx >= lines.length) { state.convo.playingLine = null; render(); return; }
  state.convo.playingLine = idx;
  render();
  const line = lines[idx];
  speakAs(line.c, line.u, () => setTimeout(() => playAllConvo(lines, idx + 1), 500));
}

// Configuration — change provider here to swap. Each provider implementation
// returns the same standardised shape: { zh, jp, en, bd, pattern? }
const TRANSLATION_PROVIDER = 'gemini';   // 'gemini' | 'claude' | 'openai'

function getApiKey() {
  return localStorage.getItem('cantonese_api_key') || '';
}
function setApiKey(key) {
  localStorage.setItem('cantonese_api_key', key);
}

// Path progress persistence
const PATH_PROGRESS_KEY = 'cantonese_path_progress';

// Composite lesson key: 'greetings-t1', 'greetings-t2' etc.
// Allows the same topic at multiple tiers within a single path.
function lessonKey(topicKey, tier) {
  return topicKey + '-t' + tier;
}

function loadPathProgress() {
  try {
    const raw = localStorage.getItem(PATH_PROGRESS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}
function savePathProgress() {
  try {
    localStorage.setItem(PATH_PROGRESS_KEY, JSON.stringify(state.pathProgress));
  } catch (e) {
    // localStorage full or unavailable — fail silently, in-memory state still works
  }
}

// One-time migration: convert legacy progress keys (no tier suffix) to composite keys.
// Pre-refactor data was stored as pathProgress.beginner.greetings = true.
// Post-refactor it should be pathProgress.beginner['greetings-t1'] = true.
// Legacy entries are assumed to be tier 1 since that's all the previous build referenced.
function migratePathProgressIfNeeded() {
  let changed = false;
  Object.keys(state.pathProgress).forEach(pathKey => {
    const bucket = state.pathProgress[pathKey];
    if (!bucket || typeof bucket !== 'object') return;
    Object.keys(bucket).forEach(key => {
      // Composite keys end with -t<number>. Anything else is legacy.
      if (!/-t\d+$/.test(key)) {
        bucket[lessonKey(key, 1)] = bucket[key];
        delete bucket[key];
        changed = true;
      }
    });
  });
  if (changed) savePathProgress();
}

function isLessonComplete(pathKey, topicKey, tier) {
  const bucket = state.pathProgress[pathKey];
  return !!(bucket && bucket[lessonKey(topicKey, tier)]);
}
function toggleLessonComplete(pathKey, topicKey, tier) {
  if (!state.pathProgress[pathKey]) state.pathProgress[pathKey] = {};
  const k = lessonKey(topicKey, tier);
  if (state.pathProgress[pathKey][k]) {
    delete state.pathProgress[pathKey][k];
  } else {
    state.pathProgress[pathKey][k] = true;
  }
  savePathProgress();
}
function pathCompleteCount(pathKey) {
  const p = state.pathProgress[pathKey];
  if (!p) return 0;
  const path = store.paths.find(x => x.key === pathKey);
  if (!path) return 0;
  return path.lessons.filter(l => p[lessonKey(l.topic, l.round)]).length;
}
// Returns the first incomplete lesson as { topic, tier }, or null if all done.
function nextIncompleteLesson(pathKey) {
  const path = store.paths.find(x => x.key === pathKey);
  if (!path) return null;
  const p = state.pathProgress[pathKey] || {};
  const next = path.lessons.find(l => !p[lessonKey(l.topic, l.round)]);
  return next ? { topic: next.topic, tier: next.round } : null;
}

function buildPrompt(text, direction) {
  const isToYue = direction === 'en-yue';
  const sourceLabel = isToYue ? 'English' : 'Cantonese (in characters or jyutping)';
  const targetLabel = isToYue ? 'Cantonese' : 'English';
  return `You are a Cantonese language learning assistant. Translate the following ${sourceLabel} text to ${targetLabel}.

Important rules:
- Use COLLOQUIAL Cantonese (HK style), not Mandarin/Standard Written Chinese
- Use Cantonese-specific characters where appropriate (e.g. 嘅, 咗, 嚟, 喺, 唔, 啲, 咁, 嗰)
- Use jyutping romanization (with tone numbers 1-6)
- Provide a word-by-word breakdown grouping characters into meaningful chunks

Input: "${text}"

Respond ONLY with valid JSON in this exact format (no markdown, no code fences, no commentary):
{
  "zh": "Cantonese characters here",
  "jp": "jyutping with tone numbers here",
  "en": "English meaning here",
  "bd": [
    {"c": "chunk in Chinese", "j": "chunk in jyutping", "e": "chunk meaning in English"}
  ]
}`;
}

function parseAiResponse(text) {
  // Strip code fences if present, find first { ... } block
  const cleaned = text.replace(/```json\s*|\s*```/g, '').trim();
  const match = cleaned.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('No JSON found in response');
  const obj = JSON.parse(match[0]);
  if (!obj.zh || !obj.jp || !obj.en || !Array.isArray(obj.bd)) {
    throw new Error('Response missing required fields');
  }
  return obj;
}

// ── Provider implementations ──
async function callGemini(prompt, apiKey) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${encodeURIComponent(apiKey)}`;
  const body = JSON.stringify({
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.3, responseMimeType: 'application/json' },
  });

  // Retry up to 3 times on transient errors (503, 502, 429-with-retry)
  const maxAttempts = 3;
  let lastErr;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body,
    });
    if (res.ok) {
      const data = await res.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error('Gemini returned empty response');
      return text;
    }
    const errText = await res.text();
    const isTransient = res.status === 503 || res.status === 502 || res.status === 504;
    lastErr = `Gemini error ${res.status}: ${errText.slice(0, 200)}`;
    if (!isTransient || attempt === maxAttempts) {
      throw new Error(lastErr);
    }
    // Exponential backoff: 1s, then 2s
    await new Promise(r => setTimeout(r, attempt * 1000));
  }
  throw new Error(lastErr);
}

async function callClaude(prompt, apiKey) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1024,
      messages: [{ role: 'user', content: prompt }],
    }),
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Claude error ${res.status}: ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  const text = data?.content?.[0]?.text;
  if (!text) throw new Error('Claude returned empty response');
  return text;
}

async function callOpenAI(prompt, apiKey) {
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      messages: [{ role: 'user', content: prompt }],
      response_format: { type: 'json_object' },
    }),
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`OpenAI error ${res.status}: ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  const text = data?.choices?.[0]?.message?.content;
  if (!text) throw new Error('OpenAI returned empty response');
  return text;
}

// Single entry point — rest of app calls only this
async function translateText(text, direction = 'en-yue') {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error('Missing API key');
  const prompt = buildPrompt(text, direction);
  let raw;
  switch (TRANSLATION_PROVIDER) {
    case 'gemini': raw = await callGemini(prompt, apiKey); break;
    case 'claude': raw = await callClaude(prompt, apiKey); break;
    case 'openai': raw = await callOpenAI(prompt, apiKey); break;
    default: throw new Error('Unknown provider: ' + TRANSLATION_PROVIDER);
  }
  return parseAiResponse(raw);
}

// ── Speech recognition ───────────────────────────────────────────────────────
let _recognition = null;

function normalizeChinese(text) {
  // Strip whitespace and Chinese punctuation for comparison
  return (text || '').replace(/[\s，。！？、,!?.\-]/g, '');
}

// Edit-distance (Levenshtein) between two strings. Order-sensitive.
function editDistance(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  // Use a rolling row of size b.length+1
  let prev = new Array(b.length + 1);
  let curr = new Array(b.length + 1);
  for (let j = 0; j <= b.length; j++) prev[j] = j;
  for (let i = 1; i <= a.length; i++) {
    curr[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      curr[j] = Math.min(
        curr[j - 1] + 1,       // insertion
        prev[j]   + 1,         // deletion
        prev[j - 1] + cost     // substitution
      );
    }
    [prev, curr] = [curr, prev];
  }
  return prev[b.length];
}

// Collapse consecutive duplicate substrings of length >= minLen. Defends against
// speech-recognition glitches where the recogniser emits "星期六得星期六得…" instead of
// "星期六得…" for a single utterance. minLen=4 is safe against legitimate Cantonese
// reduplications (好好, 慢慢, 馬馬虎虎 etc. are all 1–2 char base patterns).
function deduplicateRepeats(s, minLen) {
  minLen = minLen || 4;
  let changed = true;
  // Cap iterations defensively in case of pathological input
  for (let safety = 0; changed && safety < 20; safety++) {
    changed = false;
    for (let len = Math.floor(s.length / 2); len >= minLen; len--) {
      for (let i = 0; i + 2 * len <= s.length; i++) {
        if (s.substring(i, i + len) === s.substring(i + len, i + 2 * len)) {
          s = s.substring(0, i + len) + s.substring(i + 2 * len);
          changed = true;
          break;
        }
      }
      if (changed) break;
    }
  }
  return s;
}

function fuzzyMatch(heard, target) {
  const h = normalizeChinese(heard);
  const t = normalizeChinese(target);
  if (!h || !t) return false;
  if (h === t) return true;
  // Allow edits up to ~30% of target length, with a small floor for very
  // short utterances (so 1-char slip on a 3-char phrase still counts).
  const dist = editDistance(h, t);
  const allowed = Math.max(1, Math.floor(t.length * 0.3));
  return dist <= allowed;
}

// Align heard text against target text and return per-target-char status:
//   { status: 'match' }                            — target[j] was said correctly
//   { status: 'wrong', heardChar: '<char>' }       — target[j] was said as a different char
//   { status: 'missing' }                          — target[j] was skipped/not heard
//
// Standard Needleman-Wunsch / Levenshtein DP, then backtrack the optimal path.
// Both inputs should be normalized (punctuation/whitespace stripped) before calling.
function alignChars(heard, target) {
  const m = heard.length, n = target.length;
  if (!n) return [];
  // DP matrix: dp[i][j] = min edits to turn heard[0..i] into target[0..j]
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = heard[i - 1] === target[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,         // deletion from heard
        dp[i][j - 1] + 1,         // insertion (= target char missing)
        dp[i - 1][j - 1] + cost   // substitution or match
      );
    }
  }
  // Backtrack from (m,n) to (0,0) — prefer diagonal moves on ties (more intuitive alignment)
  const marks = new Array(n);
  let i = m, j = n;
  while (i > 0 && j > 0) {
    const same = heard[i - 1] === target[j - 1];
    const diag = dp[i - 1][j - 1] + (same ? 0 : 1);
    if (dp[i][j] === diag) {
      marks[j - 1] = same ? { status: 'match' } : { status: 'wrong', heardChar: heard[i - 1] };
      i--; j--;
    } else if (dp[i][j] === dp[i][j - 1] + 1) {
      marks[j - 1] = { status: 'missing' };
      j--;
    } else {
      // up: extra heard char — no corresponding target slot
      i--;
    }
  }
  while (j > 0) { marks[j - 1] = { status: 'missing' }; j--; }
  return marks;
}

// Build the visual per-syllable breakdown grid for the Speak mismatch panel.
// Returns '' when char↔syllable alignment can't be cleanly established (e.g. a
// foreign word like 'William' embedded in Chinese), so the caller can fall back.
function renderSpeakBreakdown(heard, targetC, targetJ) {
  const punct = /[\s，。！？、,!?.\-]/;
  const charArr = Array.from(targetC).filter(c => !punct.test(c));
  // Split by whitespace, then strip any trailing punctuation that came with the syllable
  const jpArr   = (targetJ || '').split(/\s+/)
    .map(s => s.replace(/[，。！？、,!?.\-]+$/, ''))
    .filter(Boolean);
  if (!charArr.length || charArr.length !== jpArr.length) return '';   // alignment-impossible — caller handles fallback

  const heardClean = normalizeChinese(heard);
  const marks = alignChars(heardClean, charArr.join(''));

  const cols = charArr.map((c, idx) => {
    const m = marks[idx] || { status: 'missing' };
    const bad = m.status !== 'match';
    const tone = jpArr[idx].match(/[1-6]/);
    const toneColor = tone ? TONES[tone[0]].color : '#777';
    const charColor = bad ? '#E74C3C' : '#1a1a2e';
    const jpColor   = bad ? '#E74C3C' : toneColor;
    const mark = m.status === 'match'   ? '✓'
               : m.status === 'wrong'   ? m.heardChar
               : '·';   // missing
    const markStyle = m.status === 'match' ? 'color:#27AE60;font-weight:700;'
                    : m.status === 'wrong' ? 'color:#E74C3C;font-weight:700;font-size:14px;'
                    : 'color:#E74C3C;font-weight:700;';
    return `<div class="bd-col">
      <div class="bd-char" style="color:${charColor}">${c}</div>
      <div class="bd-status" style="${markStyle}">${mark}</div>
      <div class="bd-jp" style="color:${jpColor};font-weight:700">${jpArr[idx]}</div>
    </div>`;
  }).join('');

  return `<div class="speak-breakdown">${cols}</div>`;
}

function startListening() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) return;
  if (_recognition) { try { _recognition.abort(); } catch(e){} }

  const rec = new SpeechRec();
  rec.lang = 'yue-Hant-HK';
  rec.continuous = true;        // keep listening until user stops
  rec.interimResults = true;    // capture words as they're heard
  rec.maxAlternatives = 3;

  let finalTranscript = '';
  let interimTranscript = '';

  rec.onresult = (e) => {
    interimTranscript = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const transcript = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        // Three rules to defend against recogniser quirks:
        //  1) Skip exact duplicate — recogniser emitted the same segment twice
        //  2) Replace on cumulative-and-extending — segment is full transcript so far
        //  3) Otherwise treat as a true delta and append
        if (finalTranscript && transcript === finalTranscript) {
          // rule 1 — skip
        } else if (finalTranscript && transcript.length > finalTranscript.length && transcript.startsWith(finalTranscript)) {
          finalTranscript = transcript;  // rule 2
        } else {
          finalTranscript += transcript; // rule 3
        }
        // Post-pass: collapse any consecutive-duplicate substring of length >= 4.
        // Safety net for delivery patterns that slip past rules 1–3.
        finalTranscript = deduplicateRepeats(finalTranscript);
      } else {
        interimTranscript += transcript;
      }
    }
    state.convo.speakHeard = (finalTranscript + interimTranscript).trim() || '…';
    render();
  };
  rec.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;  // user-initiated stop
    state.convo.speakStatus = 'mismatch';
    state.convo.speakHeard = '(error: ' + e.error + ')';
    render();
  };
  rec.onend = () => {
    // Recognition session ended — if user is still in 'listening' mode, evaluate result
    if (state.convo.speakStatus === 'listening') {
      const heard = finalTranscript.trim();
      if (!heard) {
        state.convo.speakStatus = 'idle';
        state.convo.speakHeard  = '';
      } else {
        const target = getRoundConvo(state.topic, state.currentRound).lines[state.convo.speakStep].c;
        const matched = fuzzyMatch(heard, target);
        state.convo.speakHeard  = heard;
        state.convo.speakStatus = matched ? 'matched' : 'mismatch';
        if (matched) speak(target);
      }
      render();
    }
  };

  state.convo.speakStatus = 'listening';
  state.convo.speakHeard = '';
  render();
  try { rec.start(); } catch(e) {
    state.convo.speakStatus = 'idle';
    render();
  }
  _recognition = rec;
}

function stopListening() {
  if (_recognition) { try { _recognition.abort(); } catch(e){} _recognition = null; }
}

// User pressed stop — gracefully end so onend fires and processes result
function finishListening() {
  if (_recognition) { try { _recognition.stop(); } catch(e){} }
}

// ── Translate speech input ───────────────────────────────────────────────────
let _translateRec = null;

function startTranslateListening() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) {
    state.translate.error = 'Speech recognition not supported on this browser';
    render();
    return;
  }
  if (_translateRec) { try { _translateRec.abort(); } catch(e){} }

  const isToYue = state.translate.direction === 'en-yue';
  const rec = new SpeechRec();
  // For en-yue mode: input is English. For yue-en mode: input is Cantonese.
  rec.lang = isToYue ? 'en-US' : 'yue-Hant-HK';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  let finalTranscript = '';

  rec.onresult = (e) => {
    // Process results from e.resultIndex onwards with a persistent finalTranscript.
    // Some Android Chrome builds deliver each final result as the CUMULATIVE transcript
    // rather than a delta — detect that and replace, so we don't end up with
    // "II haveI have green pants" style triplication.
    let interimText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const seg = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        if (finalTranscript && seg === finalTranscript) {
          // rule 1 — skip exact duplicate
        } else if (finalTranscript && seg.length > finalTranscript.length && seg.startsWith(finalTranscript)) {
          finalTranscript = seg;
        } else {
          finalTranscript += seg;
        }
        finalTranscript = deduplicateRepeats(finalTranscript);
      } else {
        interimText += seg;
      }
    }
    state.translate.inputText = (finalTranscript + interimText).trim();
    // Update textarea directly without full re-render to avoid focus loss
    const ta = document.getElementById('translate-input');
    if (ta) ta.value = state.translate.inputText;
  };
  rec.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    state.translate.error = 'Speech error: ' + e.error;
    state.translate.listening = false;
    render();
  };
  rec.onend = () => {
    if (state.translate.listening) {
      state.translate.listening = false;
      state.translate.inputText = finalTranscript.trim() || state.translate.inputText;
      render();
    }
  };

  state.translate.listening = true;
  state.translate.error = null;
  render();
  try { rec.start(); } catch(e) {
    state.translate.listening = false;
    state.translate.error = 'Could not start microphone';
    render();
  }
  _translateRec = rec;
}

function stopTranslateListening() {
  if (_translateRec) { try { _translateRec.stop(); } catch(e){} }
}

function renderLearningPath() {
  if (state.pathView === 'timeline') {
    return renderPathTimeline(state.activePath);
  }
  return renderPathList();
}

function renderPathList() {
  // Group paths by level
  const byLevel = {};
  store.paths.forEach(p => {
    if (!byLevel[p.level]) byLevel[p.level] = [];
    byLevel[p.level].push(p);
  });
  const levelOrder = ['Beginner', 'Intermediate', 'Advanced'];
  const sections = levelOrder.filter(l => byLevel[l]).map(level => {
    const cards = byLevel[level].map(p => {
      const total = p.lessons.length;
      const done = pathCompleteCount(p.key);
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      const locked = !!p.comingSoon;
      const cardCls = 'path-card' + (locked ? ' locked' : '');
      const dataAttr = locked ? '' : `data-path-open="${p.key}"`;
      const badge = locked
        ? `<span class="path-card-badge coming">Coming Soon</span>`
        : (total > 0 && done === total ? `<span class="path-card-badge" style="background:#4CAF50;color:#fff">Complete</span>` : '');
      const progress = locked ? '' : `
        <div class="path-card-progress">
          <div class="path-progress-bar"><div class="path-progress-fill" style="width:${pct}%"></div></div>
          <span class="path-progress-count">${done} / ${total}</span>
        </div>`;
      return `
        <div class="${cardCls}" ${dataAttr}>
          <div class="path-card-top">
            <span class="path-card-icon">${p.icon}</span>
            <span class="path-card-title">${p.label}</span>
            ${badge}
          </div>
          <div class="path-card-desc">${p.desc}</div>
          ${progress}
        </div>`;
    }).join('');
    return `
      <div class="path-level-header">${level}</div>
      ${cards}`;
  }).join('');

  return `
    <div class="path-list">
      <h2 style="font-size:22px;font-weight:700;color:#1a1a2e;margin-bottom:4px;">🛤️ Learning Path</h2>
      <div style="font-size:12px;color:#888;margin-bottom:14px;">Curated lessons in order. Tap any to jump in — nothing is locked.</div>
      ${sections}
    </div>`;
}

function renderPathTimeline(pathKey) {
  const path = store.paths.find(p => p.key === pathKey);
  if (!path) return `<div class="path-empty-msg">Path not found.</div>`;
  if (!path.lessons.length) {
    return `
      <div class="path-timeline-wrap">
        <button class="path-timeline-back" data-path-back>← Back to Learning Paths</button>
        <div class="path-empty-msg">${path.icon} ${path.label} — coming soon.</div>
      </div>`;
  }
  const total = path.lessons.length;
  const done = pathCompleteCount(pathKey);
  const pct = Math.round((done / total) * 100);
  const nextLesson = nextIncompleteLesson(pathKey);

  const steps = path.lessons.map((l, i) => {
    const lesson = lessonShape(l.topic);
    if (!lesson) return ''; // Defensive — skip if topic doesn't exist
    const tier = l.round;
    const complete = isLessonComplete(pathKey, l.topic, tier);
    const isNext = !complete && nextLesson && l.topic === nextLesson.topic && tier === nextLesson.tier;
    const stepCls = 'path-step' + (complete ? ' done' : '') + (isNext ? ' next' : '');
    const nextBadge = isNext ? `<span class="path-next-badge">Next up</span>` : '';
    const wordCount = (getRoundWords(l.topic, tier) || []).length;
    // Show tier in meta only when above 1, to keep Tier 1 displays clean
    const tierLabel = tier > 1 ? `Tier ${tier} · ` : '';
    return `
      <div class="${stepCls}">
        <div class="path-step-rail">
          <div class="path-step-node">${complete ? '✓' : (i + 1)}</div>
          <div class="path-step-line"></div>
        </div>
        <div class="path-step-body">
          <div class="path-step-card" data-path-lesson="${l.topic}" data-path-tier="${tier}">
            ${nextBadge}
            <div class="path-step-row">
              <span class="path-step-icon">${lesson.icon}</span>
              <div class="path-step-text">
                <div class="path-step-title">${lesson.label}</div>
                <div class="path-step-meta">${tierLabel}${wordCount} word${wordCount !== 1 ? 's' : ''}</div>
              </div>
              <button class="path-complete-btn" data-path-toggle="${l.topic}" data-path-tier="${tier}" aria-label="${complete ? 'Mark incomplete' : 'Mark complete'}">${complete ? '✓' : '✓'}</button>
            </div>
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="path-timeline-wrap">
      <button class="path-timeline-back" data-path-back>← Back to Learning Paths</button>
      <div class="path-timeline-header">
        <div class="path-timeline-title">${path.icon} ${path.label}</div>
        <div class="path-timeline-sub">${path.desc}</div>
        <div class="path-timeline-progress">
          <div class="path-progress-bar"><div class="path-progress-fill" style="width:${pct}%"></div></div>
          <span class="path-progress-count">${done} / ${total} complete</span>
        </div>
      </div>
      <div class="path-timeline">${steps}</div>
    </div>`;
}
