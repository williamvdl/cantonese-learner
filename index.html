<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廣東話 Cantonese Learner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f7f3ee; min-height: 100vh; padding-bottom: 70px; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }

  /* Hamburger menu */
  .hamburger { background: transparent; border: none; cursor: pointer; padding: 4px; display: flex; flex-direction: column; gap: 5px; }
  .hamburger span { display: block; width: 22px; height: 2px; background: #e8c97e; border-radius: 2px; transition: all 0.2s; }
  .nav-drawer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; display: none; }
  .nav-drawer.open { display: block; }
  .nav-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
  .nav-panel { position: absolute; top: 0; right: 0; width: 240px; height: 100%; background: #1a1a2e; padding: 0; display: flex; flex-direction: column; box-shadow: -4px 0 24px rgba(0,0,0,0.3); }
  .nav-panel-header { padding: 20px 20px 16px; border-bottom: 1px solid #2e2e4e; display: flex; align-items: center; justify-content: space-between; }
  .nav-panel-title { font-size: 13px; color: #e8c97e; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .nav-close { background: transparent; border: none; color: #aaa; font-size: 20px; cursor: pointer; padding: 0; line-height: 1; }
  .nav-item { display: flex; align-items: center; gap: 14px; padding: 16px 20px; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; transition: background 0.15s; border-bottom: 1px solid #2e2e4e22; }
  .nav-item:hover { background: #252540; }
  .nav-item.active { background: #252540; }
  .nav-item .ni-icon { font-size: 22px; }
  .nav-item .ni-text { display: flex; flex-direction: column; gap: 2px; }
  .nav-item .ni-label { font-size: 15px; font-weight: 700; color: #fff; }
  .nav-item .ni-desc { font-size: 11px; color: #666; }
  .nav-item.active .ni-label { color: #e8c97e; }
  .nav-item .ni-tick { margin-left: auto; color: #e8c97e; font-size: 16px; opacity: 0; }
  .nav-item.active .ni-tick { opacity: 1; }

  /* Header */
  .header { background: #1a1a2e; padding: 16px 20px 12px; position: sticky; top: 0; z-index: 10; }
  .header-title { display: flex; align-items: baseline; gap: 10px; }
  .header-title .zh { font-size: 24px; color: #e8c97e; }
  .header-title .en { font-size: 11px; color: #aaa; letter-spacing: 2px; text-transform: uppercase; }
  .tone-key { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .tone-key span { font-size: 11px; font-weight: 700; }
  .tone-key .label { color: #555; font-weight: 400; }

  /* Voice banner */
  .voice-banner { margin: 10px 20px 0; padding: 8px 14px; border-radius: 10px; font-size: 11px; display: flex; align-items: center; gap: 6px; }
  .voice-ok  { background: #eafaf1; border: 1px solid #27AE60; color: #1E8449; }
  .voice-warn{ background: #fef9e7; border: 1px solid #F0B27A; color: #935116; }
  .voice-none{ background: #fdedec; border: 1px solid #E74C3C; color: #922B21; }

  /* Topic pills */
  .topics { display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 6px; scrollbar-width: none; }
  .topic-btn { flex-shrink: 0; padding: 7px 13px; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 600; border: 2px solid #ddd; background: #fff; color: #555; white-space: nowrap; transition: all 0.18s; }
  .topic-btn.active { color: #fff; }

  /* Content */
  .content { padding: 12px 20px 40px; max-width: 680px; margin: 0 auto; }
  .lesson-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .lesson-title { font-size: 20px; font-weight: 700; margin: 0; }
  .lesson-count { font-size: 12px; color: #999; margin-top: 2px; }
  .mode-btn { padding: 7px 16px; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 700; transition: all 0.15s; }
  .hint { font-size: 11px; color: #aaa; margin-bottom: 12px; }

  /* Word grid */
  .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; }

  /* Word card */
  .word-card { cursor: pointer; border-radius: 14px; padding: 24px 14px 14px; min-height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; position: relative; transition: background 0.2s, box-shadow 0.2s; border: 2px solid; user-select: none; }
  .card-chinese { font-size: 34px; color: #1a1a2e; line-height: 1.2; }
  .card-jyutping { font-size: 12px; margin-top: 2px; }
  .card-hint { font-size: 11px; color: #bbb; margin-top: 1px; }
  .card-english { font-size: 15px; font-weight: 700; color: #fff; text-align: center; padding: 0 8px; }
  .speak-btn { position: absolute; top: 6px; right: 6px; width: 54px; height: 54px; border-radius: 50%; cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  @keyframes pulse { from { opacity:1; } to { opacity:0.4; } }
  .speaking { animation: pulse 0.6s infinite alternate; }

  /* Home screen — categorised topic cards */
  .home-wrap { padding: 12px 20px 32px; max-width: 760px; margin: 0 auto; }
  .home-header { margin-bottom: 14px; }
  .home-title { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
  .home-subtitle { font-size: 12px; color: #999; }

  .cat-filter-wrap { margin-bottom: 14px; }
  .cat-filter-select { width: 100%; padding: 12px 36px 12px 14px; font-size: 14px; font-weight: 600; color: #1a1a2e; background: #fff; border: 2px solid #ddd; border-radius: 12px; cursor: pointer; appearance: none; -webkit-appearance: none; -moz-appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231a1a2e'><path d='M7 10l5 5 5-5z'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; background-size: 22px; font-family: inherit; }
  .cat-filter-select:focus { outline: none; border-color: #1a1a2e; }

  .cat-section { margin-bottom: 24px; }
  .cat-section-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; padding: 0 4px; }
  .cat-section-title { font-size: 14px; font-weight: 700; color: #1a1a2e; }
  .cat-section-count { font-size: 11px; color: #aaa; font-weight: 600; }

  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .topic-card { cursor: pointer; border-radius: 14px; padding: 16px 14px; background: #fff; border: 2px solid; min-height: 100px; display: flex; flex-direction: column; gap: 4px; transition: all 0.15s; position: relative; user-select: none; }
  .topic-card:active { transform: scale(0.97); }
  .topic-card-icon { font-size: 28px; line-height: 1; margin-bottom: 4px; }
  .topic-card-label { font-size: 14px; font-weight: 700; color: #1a1a2e; line-height: 1.2; }
  .topic-card-meta { font-size: 11px; color: #888; margin-top: auto; }
  .topic-card-rounds { display: flex; gap: 3px; margin-top: 4px; }
  .topic-card-pip { width: 6px; height: 6px; border-radius: 50%; }

  /* Round selector inside topic page */
  .round-selector { display: flex; gap: 6px; margin-bottom: 12px; align-items: center; }
  .round-label { font-size: 11px; color: #888; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-right: 4px; }
  .round-btn { padding: 5px 12px; border-radius: 16px; border: 2px solid; background: #fff; cursor: pointer; font-size: 12px; font-weight: 700; transition: all 0.15s; }
  .round-btn.active { color: #fff; }

  /* Back-to-home button */
  .back-home-btn { display: inline-flex; align-items: center; gap: 5px; background: transparent; border: none; color: #888; font-size: 13px; cursor: pointer; padding: 4px 0; margin-bottom: 8px; font-weight: 600; }
  .back-home-btn:hover { color: #1a1a2e; }

  /* Translate */
  .translate-wrap { padding: 16px 20px 32px; max-width: 680px; margin: 0 auto; }
  .translate-header { margin-bottom: 16px; }
  .translate-header h2 { font-size: 20px; font-weight: 700; color: #2C3E7A; margin-bottom: 4px; }
  .translate-header p { font-size: 12px; color: #999; }
  .translate-input-wrap { background: #fff; border-radius: 14px; padding: 14px; border: 1px solid #eee; margin-bottom: 12px; }
  .translate-input { width: 100%; min-height: 60px; border: none; outline: none; font-size: 16px; font-family: inherit; resize: vertical; color: #1a1a2e; background: transparent; }
  .translate-input::placeholder { color: #bbb; }
  .translate-input-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f4f0eb; }
  .translate-mic { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid #2C3E7A; background: transparent; color: #2C3E7A; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .translate-mic.listening { background: #E74C3C; border-color: #E74C3C; color: #fff; animation: micPulse 1s infinite; }
  .translate-direction-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; padding: 8px 14px; background: #fff; border-radius: 30px; border: 1px solid #eee; }
  .translate-dir-label { font-size: 13px; font-weight: 700; color: #2C3E7A; padding: 4px 10px; border-radius: 16px; }
  .translate-dir-label.muted { color: #aaa; font-weight: 500; }
  .translate-dir-swap { background: #2C3E7A; border: none; cursor: pointer; font-size: 16px; color: #fff; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(44,62,122,0.3); transition: all 0.15s; flex-shrink: 0; }
  .translate-dir-swap:active { transform: scale(0.92); }
  .translate-listening-hint { font-size: 11px; color: #E74C3C; font-weight: 700; margin-top: 6px; text-align: center; animation: pulse 0.6s infinite alternate; }
  .translate-go { flex: 1; padding: 10px 18px; background: #2C3E7A; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .translate-go:disabled { opacity: 0.5; cursor: default; }
  .translate-clear { padding: 10px 14px; background: transparent; color: #888; border: 1px solid #ddd; border-radius: 10px; font-size: 13px; cursor: pointer; }
  .translate-loading { padding: 30px 16px; text-align: center; color: #888; font-size: 13px; }
  .translate-error { background: #fde8ea; border: 1px solid #E74C3C; color: #7b1c1c; padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
  .translate-result { background: #fff; border-radius: 14px; padding: 16px 18px; border: 2px solid #2C3E7A22; }
  .translate-zh { font-size: 22px; line-height: 1.4; color: #1a1a2e; margin-bottom: 8px; }
  .translate-jp { font-size: 14px; margin-bottom: 8px; }
  .translate-result-actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f4f0eb; }
  .translate-action-btn { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1.5px solid #2C3E7A; background: transparent; color: #2C3E7A; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .translate-action-btn.primary { background: #2C3E7A; color: #fff; }

  /* API key setup */
  .apikey-setup { background: #fff; border-radius: 14px; padding: 22px 18px; border: 2px dashed #2C3E7A; margin-bottom: 16px; text-align: center; }
  .apikey-setup h3 { font-size: 16px; color: #2C3E7A; margin-bottom: 8px; }
  .apikey-setup p { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 12px; }
  .apikey-setup small { color: #aaa; font-size: 11px; }
  .apikey-input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; font-family: monospace; margin-bottom: 10px; box-sizing: border-box; }
  .apikey-save { padding: 10px 18px; background: #2C3E7A; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; }
  .apikey-toggle-row { display: flex; justify-content: flex-end; margin-top: 6px; }
  .apikey-toggle-btn { background: transparent; border: none; color: #999; font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline; }

  /* Patterns section */
  .patterns-header { padding: 16px 20px 0; max-width: 680px; margin: 0 auto; }
  .patterns-header h2 { font-size: 20px; font-weight: 700; color: #2C3E7A; margin-bottom: 4px; }
  .patterns-header p { font-size: 12px; color: #999; margin-bottom: 16px; }
  .pattern-card { background: #fff; border-radius: 16px; margin: 0 20px 14px; border: 1px solid #eee; overflow: hidden; max-width: 680px; }
  .pattern-head { padding: 14px 16px 12px; background: #2C3E7A; }
  .pattern-number { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
  .pattern-label { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .pattern-structure { display: inline-block; background: rgba(255,255,255,0.12); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: rgba(255,255,255,0.85); font-family: monospace; }
  .pattern-body { padding: 12px 16px 14px; }
  .pattern-note { font-size: 12px; color: #888; margin-bottom: 12px; line-height: 1.5; font-style: italic; }
  .pattern-examples { display: flex; flex-direction: column; gap: 8px; }
  .pattern-example { display: flex; align-items: center; gap: 10px; background: #f7f3ee; border-radius: 10px; padding: 10px 12px; }
  .pattern-ex-text { flex: 1; }
  .pattern-ex-zh { font-size: 17px; color: #1a1a2e; margin-bottom: 3px; line-height: 1.3; }
  .pattern-ex-jp { font-size: 12px; margin-bottom: 3px; }
  .pattern-ex-en { font-size: 11px; color: #888; }
  .pattern-ex-play { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #2C3E7A; background: transparent; color: #2C3E7A; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .pattern-ex-play.speaking { background: #2C3E7A; color: #fff; animation: pulse 0.6s infinite alternate; }

  /* Sentences */
  .sentences { margin-top: 28px; }
  .sentences h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #1a1a2e; }
  .sentence-card { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid #eee; display: flex; align-items: flex-start; gap: 12px; }
  .sentence-body { flex: 1; }
  .sentence-chinese { font-size: 17px; color: #1a1a2e; margin-bottom: 4px; line-height: 1.4; }
  .sentence-jyutping { font-size: 12px; margin-bottom: 4px; }
  .sentence-english { font-size: 12px; color: #888; }
  .sentence-play { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; border: 1.5px solid; background: transparent; margin-top: 2px; }

  .bubble-row.right .bubble .bubble-jyutping span { color: rgba(255,255,255,0.88) !important; }

  /* Sub-tabs (Words | Conversation) */
  .subtabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .subtab-btn { flex: 1; padding: 8px 10px; border-radius: 10px; border: 2px solid #ddd; background: #fff; color: #888; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; text-align: center; }
  .subtab-btn.active { color: #fff; border-color: transparent; }

  /* Conversation */
  .convo-scenario { font-size: 12px; color: #888; margin-bottom: 14px; font-style: italic; }
  .convo-controls { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .convo-ctrl-btn { padding: 7px 14px; border-radius: 20px; border: 2px solid #ddd; background: #fff; color: #555; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .convo-ctrl-btn.on { color: #fff; border-color: transparent; }
  .bubble-row { display: flex; margin-bottom: 14px; }
  .bubble-row.left  { justify-content: flex-start; }
  .bubble-row.right { justify-content: flex-end; }
  .bubble-wrap { max-width: 80%; }
  .bubble-name { font-size: 10px; color: #aaa; margin-bottom: 3px; padding: 0 4px; }
  .bubble-row.right .bubble-name { text-align: right; }
  .bubble { border-radius: 16px; padding: 12px 14px; position: relative; }
  .bubble-row.left  .bubble { background: #fff; border: 1px solid #eee; border-bottom-left-radius: 4px; }
  .bubble-row.right .bubble { border-bottom-right-radius: 4px; color: #fff; }
  .bubble-chinese  { font-size: 17px; line-height: 1.4; margin-bottom: 4px; }
  .bubble-jyutping { font-size: 11px; margin-bottom: 3px; }
  .bubble-english  { font-size: 11px; opacity: 0.75; }
  .bubble-play-row { display: flex; justify-content: flex-end; margin-top: 8px; }
  .bubble-row.left .bubble-play-row { justify-content: flex-start; }
  .bubble-play { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid; background: transparent; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .gap-prompt { font-size: 12px; color: #888; margin-bottom: 8px; font-style: italic; }
  .gap-options { display: flex; flex-direction: column; gap: 7px; }
  .gap-btn { padding: 10px 14px; border-radius: 10px; border: 2px solid #ddd; background: #fff; color: #1a1a2e; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; transition: all 0.15s; }
  .gap-btn.correct { background: #d4edda; border-color: #27AE60; color: #1a5e2a; }
  .gap-btn.wrong   { background: #fde8ea; border-color: #E74C3C; color: #7b1c1c; }
  .gap-btn:disabled { cursor: default; }

  /* Speak mode */
  .speak-card { background: #fff; border-radius: 16px; padding: 24px 20px; border: 3px solid; margin-bottom: 16px; text-align: center; }
  .speak-prompt { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
  .speak-target-zh { font-size: 28px; line-height: 1.3; margin-bottom: 8px; color: #1a1a2e; }
  .speak-target-jp { font-size: 14px; margin-bottom: 6px; }
  .speak-target-en { font-size: 12px; color: #888; margin-bottom: 18px; }
  .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: none; font-size: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; transition: all 0.2s; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
  .mic-btn.idle { background: #fff; }
  .mic-btn.listening { animation: micPulse 1s infinite; box-shadow: 0 0 0 0 currentColor; }
  @keyframes micPulse { 0% { box-shadow: 0 0 0 0 rgba(231,76,60,0.6); } 100% { box-shadow: 0 0 0 18px rgba(231,76,60,0); } }
  .speak-status { font-size: 13px; color: #888; min-height: 20px; margin-bottom: 14px; }
  .speak-heard { background: #f7f3ee; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 18px; color: #1a1a2e; }
  .speak-result-good { background: #d4edda; border: 2px solid #27AE60; color: #1a5e2a; padding: 12px 16px; border-radius: 10px; font-weight: 700; margin-bottom: 14px; }
  .speak-result-bad  { background: #fde8ea; border: 2px solid #E74C3C; color: #7b1c1c; padding: 12px 16px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
  .speak-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .speak-action-btn { padding: 9px 20px; border-radius: 20px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; }
  .speak-unsupported { padding: 30px 20px; text-align: center; background: #fef9e7; border: 1px solid #F0B27A; border-radius: 12px; color: #935116; font-size: 13px; line-height: 1.6; }

  /* Shadow mode */
  .shadow-card { background: #fff; border-radius: 16px; padding: 24px 20px; border: 3px solid; margin-bottom: 16px; text-align: center; }
  .shadow-speaker { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .shadow-chinese { font-size: 30px; line-height: 1.3; margin-bottom: 10px; color: #1a1a2e; }
  .shadow-jyutping { font-size: 14px; margin-bottom: 6px; }
  .shadow-english { font-size: 13px; color: #888; margin-bottom: 16px; }
  .shadow-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .shadow-btn { padding: 9px 20px; border-radius: 20px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; }
  .shadow-nav { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #aaa; margin-bottom: 12px; }

  /* Breakdown panel */
  .breakdown-panel { margin-top: 8px; background: #f7f3ee; border-radius: 10px; padding: 10px 12px; border: 1px solid #e8e4df; }
  .breakdown-row { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px solid #eee; }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-zh { font-size: 16px; color: #1a1a2e; min-width: 36px; }
  .breakdown-jp { font-size: 12px; flex: 1; }
  .breakdown-en { font-size: 11px; color: #888; text-align: right; }
  .breakdown-btn { display: flex; align-items: center; gap: 4px; margin-top: 6px; background: transparent; border: none; cursor: pointer; font-size: 11px; font-weight: 700; padding: 0; }

  /* Bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2e; display: flex; border-top: 1px solid #2e2e4e; z-index: 20; }

  const rounds = [1];
  if (ROUND_DATA[topic + '-r2']) rounds.push(2);

  return rounds;
}

function getRoundWords(topic, round) {
  if (round === 1) return LESSONS[topic]?.words || [];

}

function getRoundSentences(topic, round) {
  if (round === 1) return SENTENCES[topic] || [];
  return ROUND_DATA[topic + '-r' + round]?.sentences || [];
}

function getRoundConvo(topic, round) {
  if (round === 1) return CONVOS[topic] || null;
  return ROUND_DATA[topic + '-r' + round]?.convo || null;
}

function getTopicsByCategory(categoryKey) {
  return Object.keys(TOPIC_CATEGORIES).filter(t => TOPIC_CATEGORIES[t] === categoryKey);

// ── Audio ─────────────────────────────────────────────────────────────────────
let _voices = null;

function loadVoices() {
  return new Promise(resolve => {
    const v = window.speechSynthesis.getVoices();
    if (v.length > 0) { _voices = v; resolve(v); return; }
    const handler = () => {
      _voices = window.speechSynthesis.getVoices();
      resolve(_voices);
      window.speechSynthesis.removeEventListener('voiceschanged', handler);
    };
    window.speechSynthesis.addEventListener('voiceschanged', handler);
    setTimeout(() => { _voices = window.speechSynthesis.getVoices(); resolve(_voices); }, 2500);
  });
}

function pickVoicePair(voices) {
  const zh = voices.filter(v => v.lang === 'zh-HK' || v.lang === 'zh-TW' || v.lang.startsWith('zh'));
  if (zh.length === 0) return { a: null, b: null };
  const a = zh[0];
  // Prefer the 5th voice (index 4) as speaker B — user confirmed it's male on their device
  const b = zh[4] || zh.find(v => v !== a) || null;
  return { a, b };
}

async function speak(text, onEnd, voiceOverride, pitchOverride, langOverride) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const voices = _voices || await loadVoices();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = langOverride || 'zh-HK';
  const rates = { slow: 0.6, normal: 0.8, fast: 1.1 };
  utt.rate  = rates[state.speed] || 0.8;
  utt.pitch = pitchOverride !== undefined ? pitchOverride : 1.0;
  const { a } = pickVoicePair(voices);
  if (voiceOverride) utt.voice = voiceOverride;
  else if (a) utt.voice = a;
  if (onEnd) utt.onend = onEnd;
  window.speechSynthesis.speak(utt);
}

// Speak as a specific conversation speaker — uses subtle pitch variation
async function speakAs(text, isUser, onEnd) {
  const voices = _voices || await loadVoices();
  const { a } = pickVoicePair(voices);
  const pitch = isUser ? 0.85 : 1.1;
  speak(text, onEnd, a, pitch, 'zh-HK');
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function colorJyutping(text) {
  return text.split(' ').map(syl => {
    const tone = syl.match(/[1-6]/);
    const color = tone ? TONES[tone[0]].color : '#777';
    return `<span style="color:${color};font-weight:700;margin-right:3px">${syl}</span>`;
  }).join('');
}

function getQuizInitState(words) {
  const queue = shuffle(words).slice(0, Math.min(words.length, 8));
  return {
    queue,
    idx: 0,
    score: 0,
    selected: null,
    done: false,
    choices: buildChoices(queue[0], words),
  };
}

function buildChoices(answer, all) {
  const others = shuffle(all.filter(w => w.c !== answer.c)).slice(0, 3);
  return shuffle([...others, answer]);
}

function playAllConvo(lines, idx) {
  if (idx >= lines.length) { state.convo.playingLine = null; render(); return; }
  state.convo.playingLine = idx;
  render();
  const line = lines[idx];
  speakAs(line.c, line.u, () => setTimeout(() => playAllConvo(lines, idx + 1), 500));
}

const TRANSLATION_PROVIDER = 'gemini';   // 'gemini' | 'claude' | 'openai'

function getApiKey() {
  return localStorage.getItem('cantonese_api_key') || '';
}
function setApiKey(key) {
  localStorage.setItem('cantonese_api_key', key);
}

function buildPrompt(text, direction) {
  const isToYue = direction === 'en-yue';
  const sourceLabel = isToYue ? 'English' : 'Cantonese (in characters or jyutping)';
  const targetLabel = isToYue ? 'Cantonese' : 'English';
  return `You are a Cantonese language learning assistant. Translate the following ${sourceLabel} text to ${targetLabel}.

Important rules:
- Use COLLOQUIAL Cantonese (HK style), not Mandarin/Standard Written Chinese
- Use Cantonese-specific characters where appropriate (e.g. 嘅, 咗, 嚟, 喺, 唔, 啲, 咁, 嗰)
- Use jyutping romanization (with tone numbers 1-6)
- Provide a word-by-word breakdown grouping characters into meaningful chunks

Input: "${text}"

Respond ONLY with valid JSON in this exact format (no markdown, no code fences, no commentary):
{
  "zh": "Cantonese characters here",
  "jp": "jyutping with tone numbers here",
  "en": "English meaning here",
  "bd": [
    {"c": "chunk in Chinese", "j": "chunk in jyutping", "e": "chunk meaning in English"}
  ]
}`;
}

function parseAiResponse(text) {
  // Strip code fences if present, find first { ... } block
  const cleaned = text.replace(/```json\s*|\s*```/g, '').trim();
  const match = cleaned.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('No JSON found in response');
  const obj = JSON.parse(match[0]);
  if (!obj.zh || !obj.jp || !obj.en || !Array.isArray(obj.bd)) {
    throw new Error('Response missing required fields');
  }
  return obj;
}

// ── Provider implementations ──
async function callGemini(prompt, apiKey) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${encodeURIComponent(apiKey)}`;
  const body = JSON.stringify({
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.3, responseMimeType: 'application/json' },
  });

  // Retry up to 3 times on transient errors (503, 502, 429-with-retry)
  const maxAttempts = 3;
  let lastErr;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body,
    });
    if (res.ok) {
      const data = await res.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error('Gemini returned empty response');
      return text;
    }
    const errText = await res.text();
    const isTransient = res.status === 503 || res.status === 502 || res.status === 504;
    lastErr = `Gemini error ${res.status}: ${errText.slice(0, 200)}`;
    if (!isTransient || attempt === maxAttempts) {
      throw new Error(lastErr);
    }
    // Exponential backoff: 1s, then 2s
    await new Promise(r => setTimeout(r, attempt * 1000));
  }
  throw new Error(lastErr);
}

async function callClaude(prompt, apiKey) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1024,
      messages: [{ role: 'user', content: prompt }],
    }),
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Claude error ${res.status}: ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  const text = data?.content?.[0]?.text;
  if (!text) throw new Error('Claude returned empty response');
  return text;
}

async function callOpenAI(prompt, apiKey) {
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      messages: [{ role: 'user', content: prompt }],
      response_format: { type: 'json_object' },
    }),
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`OpenAI error ${res.status}: ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  const text = data?.choices?.[0]?.message?.content;
  if (!text) throw new Error('OpenAI returned empty response');
  return text;
}

// Single entry point — rest of app calls only this
async function translateText(text, direction = 'en-yue') {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error('Missing API key');
  const prompt = buildPrompt(text, direction);
  let raw;
  switch (TRANSLATION_PROVIDER) {
    case 'gemini': raw = await callGemini(prompt, apiKey); break;
    case 'claude': raw = await callClaude(prompt, apiKey); break;
    case 'openai': raw = await callOpenAI(prompt, apiKey); break;
    default: throw new Error('Unknown provider: ' + TRANSLATION_PROVIDER);
  }
  return parseAiResponse(raw);
}

// ── Speech recognition ───────────────────────────────────────────────────────
let _recognition = null;

function normalizeChinese(text) {
  // Strip whitespace and Chinese punctuation for comparison
  return (text || '').replace(/[\s，。！？、,!?.\-]/g, '');
}

function fuzzyMatch(heard, target) {
  const h = normalizeChinese(heard);
  const t = normalizeChinese(target);
  if (!h || !t) return false;
  // Exact match
  if (h === t) return true;
  // Substantial overlap — count matching characters
  const longer = h.length > t.length ? h : t;
  const shorter = h.length > t.length ? t : h;
  let matches = 0;
  for (const ch of shorter) {
    if (longer.includes(ch)) matches++;
  }
  // Require at least 70% character match
  return (matches / shorter.length) >= 0.7;
}

function startListening() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) return;
  if (_recognition) { try { _recognition.abort(); } catch(e){} }

  const rec = new SpeechRec();
  rec.lang = 'yue-Hant-HK';
  rec.continuous = true;        // keep listening until user stops
  rec.interimResults = true;    // capture words as they're heard
  rec.maxAlternatives = 3;

  let finalTranscript = '';
  let interimTranscript = '';

  rec.onresult = (e) => {
    interimTranscript = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const transcript = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        finalTranscript += transcript;
      } else {
        interimTranscript += transcript;
      }
    }
    state.convo.speakHeard = (finalTranscript + interimTranscript).trim() || '…';
    render();
  };
  rec.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;  // user-initiated stop
    state.convo.speakStatus = 'mismatch';
    state.convo.speakHeard = '(error: ' + e.error + ')';
    render();
  };
  rec.onend = () => {
    // Recognition session ended — if user is still in 'listening' mode, evaluate result
    if (state.convo.speakStatus === 'listening') {
      const heard = finalTranscript.trim();
      if (!heard) {
        state.convo.speakStatus = 'idle';
        state.convo.speakHeard  = '';
      } else {
        const target = CONVOS[state.topic].lines[state.convo.speakStep].c;
        const matched = fuzzyMatch(heard, target);
        state.convo.speakHeard  = heard;
        state.convo.speakStatus = matched ? 'matched' : 'mismatch';
        if (matched) speak(target);
      }
      render();
    }
  };

  state.convo.speakStatus = 'listening';
  state.convo.speakHeard = '';
  render();
  try { rec.start(); } catch(e) {
    state.convo.speakStatus = 'idle';
    render();
  }
  _recognition = rec;
}

function stopListening() {
  if (_recognition) { try { _recognition.abort(); } catch(e){} _recognition = null; }
}

// User pressed stop — gracefully end so onend fires and processes result
function finishListening() {
  if (_recognition) { try { _recognition.stop(); } catch(e){} }
}

// ── Translate speech input ───────────────────────────────────────────────────
let _translateRec = null;

function startTranslateListening() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) {
    state.translate.error = 'Speech recognition not supported on this browser';
    render();
    return;
  }
  if (_translateRec) { try { _translateRec.abort(); } catch(e){} }

  const isToYue = state.translate.direction === 'en-yue';
  const rec = new SpeechRec();
  // For en-yue mode: input is English. For yue-en mode: input is Cantonese.
  rec.lang = isToYue ? 'en-US' : 'yue-Hant-HK';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  let finalTranscript = '';

  rec.onresult = (e) => {
    // Rebuild the entire transcript from all results each event — avoids
    // double-counting on mobile Chrome where resultIndex doesn't reliably advance.
    let finalText = '';
    let interimText = '';
    for (let i = 0; i < e.results.length; i++) {
      const seg = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += seg;
      else interimText += seg;
    }
    finalTranscript = finalText;
    state.translate.inputText = (finalText + interimText).trim();
    // Update textarea directly without full re-render to avoid focus loss
    const ta = document.getElementById('translate-input');
    if (ta) ta.value = state.translate.inputText;
  };
  rec.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    state.translate.error = 'Speech error: ' + e.error;
    state.translate.listening = false;
    render();
  };
  rec.onend = () => {
    if (state.translate.listening) {
      state.translate.listening = false;
      state.translate.inputText = finalTranscript.trim() || state.translate.inputText;
      render();
    }
  };

  state.translate.listening = true;
  state.translate.error = null;
  render();
  try { rec.start(); } catch(e) {
    state.translate.listening = false;
    state.translate.error = 'Could not start microphone';
    render();
  }
  _translateRec = rec;
}

function stopTranslateListening() {
  if (_translateRec) { try { _translateRec.stop(); } catch(e){} }
}

      : `background:#fff;color:#555;border-color:#ddd`;
    return `<button class="topic-btn${active?' active':''}" style="${style}" data-topic="${key}">${l.icon} ${l.label}</button>`;
  }).join('');
  return `<div class="topics">${btns}</div>`;
}

function renderLessonHeader(lesson, color) {
  const isQuiz = state.mode === 'quiz';
  const btnStyle = isQuiz
    ? `background:${color};color:#fff;border:2px solid ${color}`
    : `background:transparent;color:${color};border:2px solid ${color}`;
  const subtabs = !isQuiz ? `
    <div class="subtabs">
      <button class="subtab-btn${state.tab==='words'?' active':''}" id="tab-words"
        style="${state.tab==='words'?'background:'+color:''}">📖 Words</button>
      <button class="subtab-btn${state.tab==='convo'?' active':''}" id="tab-convo"
        style="${state.tab==='convo'?'background:'+color:''}">💬 Conversation</button>
    </div>` : '';
  return `
    <div class="lesson-header">
      <div>
        <h2 class="lesson-title" style="color:${color}">${lesson.icon} ${lesson.label}</h2>
        <div class="lesson-count">${lesson.words.length} words</div>
      </div>
      <button class="mode-btn" id="mode-toggle" style="${btnStyle}">
        ${isQuiz ? '📖 Study' : '🧠 Quiz me'}
      </button>
    </div>
    ${subtabs}`;
}

function renderConversation(color) {
  const convo = CONVOS[state.topic];
  if (!convo) return '<p style="color:#aaa;padding:20px 0">No conversation for this topic yet.</p>';
  const cv = state.convo;
  const lines = convo.lines;

  // ── Control bar ──
  const playAllStyle = cv.playingLine !== null
    ? `background:${color};color:#fff;border-color:${color}`
    : '';
  const gapOn    = cv.convMode === 'gap';
  const shadowOn = cv.convMode === 'shadow';
  const speakOn  = cv.convMode === 'speak';
  const controls = `
    <div class="convo-controls">
      <button class="convo-ctrl-btn${cv.playingLine!==null?' on':''}" id="play-all-btn"
        style="${cv.playingLine!==null?'background:'+color+';color:#fff;border-color:'+color:'border-color:'+color+';color:'+color}">
        ${cv.playingLine!==null?'⏹ Stop':'▶ Play All'}
      </button>
      <button class="convo-ctrl-btn${gapOn?' on':''}" id="gap-mode-btn"
        style="${gapOn?'background:'+color+';color:#fff;border-color:'+color:''}">
        🧩 Fill-the-Gap
      </button>
      <button class="convo-ctrl-btn${shadowOn?' on':''}" id="shadow-mode-btn"
        style="${shadowOn?'background:'+color+';color:#fff;border-color:'+color:''}">
        🎤 Shadow
      </button>
      <button class="convo-ctrl-btn${speakOn?' on':''}" id="speak-mode-btn"
        style="${speakOn?'background:'+color+';color:#fff;border-color:'+color:''}">
        🎙 Speak
      </button>
    </div>`;

  // ── Speak mode ──
  if (speakOn) {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
      return `
        <div class="convo-scenario">📍 ${convo.title}</div>
        ${controls}
        <div class="speak-unsupported">
          <div style="font-size:24px;margin-bottom:8px">🎙</div>
          <strong>Speech recognition not supported</strong><br>
          Your browser doesn't support voice input. Try Chrome on Android or desktop.
        </div>`;
    }
    const step = Math.min(cv.speakStep, lines.length - 1);
    const line = lines[step];
    const isUser = line.u;
    const spkName = isUser ? convo.speakers[1] : convo.speakers[0];
    const playing = cv.playingLine === step;
    const status  = cv.speakStatus;
    const isLast  = step >= lines.length - 1;

    const statusText = {
      idle:      isUser ? '👇 Press the mic and say the line above' : '👂 Listen, then continue',
      listening: '🎙 Listening… speak the line, then press Stop',
      matched:   '',
      mismatch:  '',
    }[status] || '';

    const result = status === 'matched'
      ? `<div class="speak-result-good">✓ Great! You said it correctly.</div>`
      : status === 'mismatch'
      ? `<div class="speak-result-bad">
          <div style="font-weight:700;margin-bottom:4px">Hmm, that didn't quite match.</div>
          <div>Expected: <strong>${line.c}</strong></div>
        </div>`
      : '';

    const heard = cv.speakHeard
      ? `<div class="speak-heard">You said: <strong>${cv.speakHeard}</strong></div>`
      : '';

    return `
      <div class="convo-scenario">📍 ${convo.title}</div>
      ${controls}
      <div class="shadow-nav">
        <span>Line ${step+1} of ${lines.length}</span>
        <span style="color:${color};font-weight:700">${isUser?'🗣 Your turn':'👂 Listen'}</span>
      </div>
      <div class="speak-card" style="border-color:${color}">
        <div class="speak-prompt">${spkName}</div>
        <div class="speak-target-zh">${line.c}</div>
        <div class="speak-target-jp">${colorJyutping(line.j)}</div>
        <div class="speak-target-en">${line.e}</div>
        ${isUser ? `
          <button class="mic-btn ${status==='listening'?'listening':'idle'}" id="mic-btn"
            style="color:${status==='listening'?'#E74C3C':color};border:3px solid ${status==='listening'?'#E74C3C':color}">
            ${status==='listening'?'🔴':'🎙'}
          </button>
          <div class="speak-status">${statusText}</div>
          ${status==='listening' ? `
            <button class="speak-action-btn" id="speak-stop-btn" style="background:#E74C3C;color:#fff;margin-bottom:14px">
              ⏹ Stop & Check
            </button>
          ` : ''}
          ${heard}
          ${result}
        ` : `
          <button class="speak-action-btn" id="speak-listen-btn"
            style="background:${playing?color+'cc':color};color:#fff">
            ${playing?'🔊 Playing…':'▶ Listen'}
          </button>
        `}
        <div class="speak-actions">
          ${isUser && status === 'mismatch' ? `
            <button class="speak-action-btn" id="speak-retry" style="background:#eee;color:#555">↻ Try Again</button>
            <button class="speak-action-btn" id="speak-skip"  style="background:${color};color:#fff">Skip →</button>
          ` : ''}
          ${(isUser && status === 'matched') || !isUser ? `
            <button class="speak-action-btn" id="speak-next" style="background:${color};color:#fff">
              ${isLast ? '🔁 Restart' : 'Next →'}
            </button>
          ` : ''}
        </div>
      </div>
      ${isUser && status === 'idle' ? `<p style="font-size:11px;color:#aaa;text-align:center;margin-top:6px">📱 Allow microphone access if prompted</p>` : ''}`;
  }

  // ── Shadow mode ──
  if (shadowOn) {
    const step = Math.min(cv.shadowStep, lines.length - 1);
    const line = lines[step];
    const isUser = line.u;
    const spkName = isUser ? convo.speakers[1] : convo.speakers[0];
    const playing = cv.playingLine === step;
    return `
      <div class="convo-scenario">📍 ${convo.title}</div>
      ${controls}
      <div class="shadow-nav">
        <span>Line ${step+1} of ${lines.length}</span>
        <span style="color:${color};font-weight:700">${isUser?'🗣 Your line':'👂 Listen'}</span>
      </div>
      <div class="shadow-card" style="border-color:${color}">
        <div class="shadow-speaker">${spkName}</div>
        <div class="shadow-chinese">${line.c}</div>
        <div class="shadow-jyutping">${colorJyutping(line.j)}</div>
        <div class="shadow-english">${line.e}</div>
        <div class="shadow-actions">
          <button class="shadow-btn" id="shadow-play"
            style="background:${playing?color+'cc':color};color:#fff">
            ${playing?'🔊 Playing…':'▶ Listen'}
          </button>
          ${cv.shadowWaiting || !isUser ? `
          <button class="shadow-btn" id="shadow-next"
            style="background:#eee;color:#555">
            ${step >= lines.length-1 ? '🔁 Restart' : 'Next →'}
          </button>` : ''}
        </div>
      </div>
      ${isUser ? '<p style="font-size:12px;color:#aaa;text-align:center">🎤 Repeat the line above, then press Next</p>' : ''}`;
  }

  // ── Read / Gap mode ──
  const bubbles = lines.map((line, i) => {
    const isUser   = line.u;
    const side     = isUser ? 'right' : 'left';
    const spkName  = isUser ? convo.speakers[1] : convo.speakers[0];
    const bubbleBg = isUser ? color : '#fff';
    const playing  = cv.playingLine === i;
    const playColor = isUser ? 'rgba(255,255,255,0.8)' : color;

    // Gap mode: hide user lines until answered
    if (gapOn && isUser) {
      const answered = cv.gapAnswers[i];
      if (!answered) {
        // Show choices
        const paired = shuffle(line.opts.map((c, k) => ({ c, j: line.optsJ[k] })));
        const opts = paired.map(opt =>
            `<button class="gap-btn" data-gap-line="${i}" data-gap-ans="${opt.c}">${colorJyutping(opt.j)}</button>`
          ).join('');
        return `
          <div class="bubble-row ${side}">
            <div class="bubble-wrap">
              <div class="bubble-name">${spkName}</div>
              <div class="bubble" style="background:${bubbleBg}22;border:2px dashed ${color}88">
                <div class="gap-prompt">👆 What would you say?</div>
                <div class="gap-options">${opts}</div>
              </div>
            </div>
          </div>`;
      } else {
        // Show answered line with result highlight
        const correct = answered === line.c;
        const hlColor = correct ? '#d4edda' : '#f8d7da';
        const hlBorder = correct ? '#27AE60' : '#E74C3C';
        return `
          <div class="bubble-row ${side}">
            <div class="bubble-wrap">
              <div class="bubble-name">${spkName} ${correct?'✓':'✗'}</div>
              <div class="bubble" style="background:${hlColor};border:2px solid ${hlBorder}">
                <div class="bubble-chinese" style="color:#1a1a2e">${line.c}</div>
                <div class="bubble-jyutping">${colorJyutping(line.j)}</div>
                <div class="bubble-english" style="color:#555">${line.e}</div>
              </div>
            </div>
          </div>`;
      }
    }

    // Normal bubble
    const revealed = cv.bubbleRevealed[i];
    const bdOpen   = cv.breakdownOpen[i];
    const engHtml  = revealed
      ? `<div class="bubble-english" style="margin-top:4px">${line.e}</div>`
      : `<div class="bubble-eng-hint" style="font-size:11px;opacity:0.5;margin-top:4px;font-style:italic">tap to see English</div>`;
    const bdPanel  = (bdOpen && line.bd) ? `
      <div class="breakdown-panel">
        ${line.bd.map(w => `
          <div class="breakdown-row">
            <span class="breakdown-zh">${w.c}</span>
            <span class="breakdown-jp">${colorJyutping(w.j)}</span>
            <span class="breakdown-en">${w.e}</span>
          </div>`).join('')}
      </div>` : '';
    const bdBtnColor = isUser ? 'rgba(255,255,255,0.7)' : color;
    const bdBtn = line.bd ? `
      <button class="breakdown-btn" data-breakdown="${i}" style="color:${bdBtnColor}">
        ${bdOpen ? '▲ hide breakdown' : '🔍 word breakdown'}
      </button>` : '';
    return `
      <div class="bubble-row ${side}">
        <div class="bubble-wrap">
          <div class="bubble-name">${spkName}</div>
          <div class="bubble" data-reveal="${i}" style="cursor:pointer;background:${bubbleBg};${playing?'box-shadow:0 0 0 3px '+color+'66':''}">
            <div class="bubble-chinese" style="${isUser?'color:#fff':''}">${line.c}</div>
            <div class="bubble-jyutping">${colorJyutping(line.j)}</div>
            ${engHtml}
            <div class="bubble-play-row">
              ${bdBtn}
              <button class="bubble-play" data-bubble="${i}"
                style="border-color:${playColor};color:${playing?(isUser?bubbleBg:color)+'':playColor};background:${playing?playColor:'transparent'}">
                ${playing?'🔊':'▶'}
              </button>
            </div>
          </div>
          ${bdPanel}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="convo-scenario">📍 ${convo.title}</div>
    ${controls}
    ${bubbles}`;
}

function renderSentences(topic, color) {
  const sentences = SENTENCES[topic] || [];
  if (!sentences.length) return '';
  const items = sentences.map((s, i) => {
    const speaking = state.speaking === 'sent-' + i;
    const bdOpen = state.sentenceBreakdownOpen[i];
    const bdPanel = (bdOpen && s.bd) ? `
      <div class="breakdown-panel" style="margin:8px 0 4px">
        ${s.bd.map(w => `
          <div class="breakdown-row">
            <span class="breakdown-zh">${w.c}</span>
            <span class="breakdown-jp">${colorJyutping(w.j)}</span>
            <span class="breakdown-en">${w.e}</span>
          </div>`).join('')}
      </div>` : '';
    const bdBtn = s.bd ? `
      <button class="breakdown-btn" data-sent-bd="${i}" style="color:${color};margin-top:6px">
        ${bdOpen ? '▲ hide breakdown' : '🔍 word breakdown'}
      </button>` : '';
    return `
      <div class="sentence-wrap" style="margin-bottom:10px">
        <div class="sentence-card" style="margin-bottom:0">
          <div class="sentence-body">
            <div class="sentence-chinese">${s.c}</div>
            <div class="sentence-jyutping">${colorJyutping(s.j)}</div>
            <div class="sentence-english">${s.e}</div>
            ${bdBtn}
          </div>
          <button class="sentence-play${speaking ? ' speaking' : ''}" data-sent="${i}"
            style="border-color:${color};color:${speaking ? '#fff' : color};background:${speaking ? color : 'transparent'}"
            title="Listen to sentence">
            ${speaking ? '🔊' : '▶'}
          </button>
        </div>
        ${bdPanel}
      </div>`;
  }).join('');
  return `
    <div class="sentences">
      <h3>💬 Simple Sentences</h3>
      ${items}
    </div>`;
}

function renderStudy(lesson, color) {
  const cards = lesson.words.map((w, i) => {
    const flipped = state.flipped[i];
    const speaking = state.speaking === i;
    const cardBg  = flipped ? color : '#fff';
    const cardShadow = flipped ? `0 4px 20px ${color}44` : '0 2px 6px rgba(0,0,0,0.06)';
    const btnBorder = flipped ? 'rgba(255,255,255,0.6)' : color;
    const btnColor  = flipped ? '#fff' : color;
    const btnBg     = speaking ? color : 'transparent';
    const inner = flipped
      ? `<div class="card-english">${w.e}</div>`
      : `<div class="card-chinese">${w.c}</div>
         <div class="card-jyutping">${colorJyutping(w.j)}</div>
         <div class="card-hint">tap to reveal</div>`;
    return `
      <div class="word-card" data-card="${i}"
        style="background:${cardBg};border-color:${color};box-shadow:${cardShadow}">
        ${inner}
        <button class="speak-btn${speaking?' speaking':''}" data-speak="${i}"
          style="background:${btnBg};border:1.5px solid ${btnBorder};color:${btnColor}" title="Listen">
          ${speaking ? '🔊' : '▶'}
        </button>
      </div>`;
  }).join('');

  const toneRows = Object.entries(TONES).map(([t,d]) =>
    `<div class="tone-row">
      <span class="tone-dot" style="background:${d.color}"></span>
      <span class="tone-desc">${t} — ${d.desc}</span>
      <span class="tone-ex" style="color:${d.color}">${d.ex}</span>
    </div>`
  ).join('');

  return `
    <div class="hint">Tap a card to reveal English · ▶ to hear pronunciation</div>
    <div class="word-grid">${cards}</div>
    ${renderSentences(state.topic, color)}
    <div class="tone-guide">
      <h3>📖 Jyutping Tone Guide</h3>
      <div class="tone-grid">${toneRows}</div>
      <p class="tone-note">The number at the end of each syllable tells you which tone to use. Colours match throughout the app.</p>
    </div>`;
}

function renderQuiz(lesson, color) {
  const q = state.quiz;
  if (!q) return '';

  if (q.done) {
    const pct = q.score / q.queue.length;
    const emoji = pct >= 0.75 ? '🏆' : pct >= 0.5 ? '⭐' : '💪';
    const msg   = pct >= 0.75 ? "Excellent! You're a natural!" : pct >= 0.5 ? "Good effort! Keep practising." : "Keep going — practice makes perfect!";
    return `
      <div class="result">
        <div class="result-emoji">${emoji}</div>
        <div class="result-score" style="color:${color}">${q.score} / ${q.queue.length} correct</div>
        <div class="result-msg">${msg}</div>
        <button class="back-btn" id="quiz-back" style="background:${color}">← Back to Lesson</button>
      </div>`;
  }

  const cw = q.queue[q.idx];
  const pct = (q.idx / q.queue.length * 100).toFixed(0);
  const choiceBtns = q.choices.map(c => {
    const isCorrect = c.c === cw.c;
    const isChosen  = q.selected === c.c;
    let cls = 'choice-btn';
    if (q.selected) { if (isCorrect) cls += ' correct'; else if (isChosen) cls += ' wrong'; }
    return `<button class="${cls}" data-choice="${c.c}" ${q.selected ? 'disabled' : ''}>${c.e}</button>`;
  }).join('');

  return `
    <div class="quiz-meta">
      <span style="color:#888">Question ${q.idx+1} / ${q.queue.length}</span>
      <span style="color:${color};font-weight:700">Score: ${q.score}</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" style="background:${color};width:${pct}%"></div>
    </div>
    <div class="quiz-card" style="border:2px solid ${color}22">
      <div class="quiz-label">What does this mean?</div>
      <div class="quiz-chinese">${cw.c}</div>
      <div class="quiz-jyutping">${colorJyutping(cw.j)}</div>
      <button class="quiz-listen" id="quiz-listen" style="border:1.5px solid ${color};color:${color}">▶ Listen</button>
    </div>
    <div class="choices">${choiceBtns}</div>`;
}

// ── Events ────────────────────────────────────────────────────────────────────
function attachEvents(lesson, color) {
  // Hamburger open
  const hamburger = document.getElementById('hamburger-btn');
  if (hamburger) hamburger.addEventListener('click', () => { state.drawerOpen = true; render(); });

  // Drawer close (X button and backdrop)
  const navClose    = document.getElementById('nav-close');
  const navBackdrop = document.getElementById('nav-backdrop');
  if (navClose)    navClose.addEventListener('click',    () => { state.drawerOpen = false; render(); });
  if (navBackdrop) navBackdrop.addEventListener('click', () => { state.drawerOpen = false; render(); });

  // Nav items
  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.nav;
      // Tapping Topics from the drawer always returns to home view
      if (target === 'topics') state.homeView = true;
      state.nav = target;
      state.drawerOpen = false;
      render();
    });
  });

  // Category quick-jump (drawer sublinks)
  document.querySelectorAll('[data-cat-jump]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.nav = 'topics';
      state.homeView = true;
      state.selectedCategory = btn.dataset.catJump;
      state.drawerOpen = false;
      window.scrollTo(0, 0);
      render();
    });
  });

  // ── Translate events ──────────────────────────────────────────
  // API key save
  const apikeySave = document.getElementById('apikey-save');
  if (apikeySave) apikeySave.addEventListener('click', () => {
    const input = document.getElementById('apikey-input');
    const key = (input?.value || '').trim();
    if (!key) {
      state.translate.error = 'Please paste your API key first';
      render();
      return;
    }
    setApiKey(key);
    state.translate.error = null;
    render();
  });

  // Show/hide API key toggle
  const apikeyToggle = document.getElementById('apikey-toggle');
  if (apikeyToggle) apikeyToggle.addEventListener('click', () => {
    state.translate.showApiKey = !state.translate.showApiKey;
    render();
  });

  // Reset API key
  const apikeyReset = document.getElementById('translate-reset-key');
  if (apikeyReset) apikeyReset.addEventListener('click', () => {
    if (confirm('Remove your saved API key? You\'ll need to re-enter it to translate.')) {
      localStorage.removeItem('cantonese_api_key');
      state.translate.result = null;
      state.translate.error = null;
      state.translate.inputText = '';
      render();
    }
  });

  // Direction swap (en-yue ↔ yue-en)
  const trSwap = document.getElementById('translate-swap');
  if (trSwap) trSwap.addEventListener('click', () => {
    stopTranslateListening();
    state.translate.direction = state.translate.direction === 'en-yue' ? 'yue-en' : 'en-yue';
    state.translate.inputText = '';
    state.translate.result    = null;
    state.translate.error     = null;
    state.translate.listening = false;
    render();
  });

  // Mic button — toggles speech input
  const trMic = document.getElementById('translate-mic');
  if (trMic) trMic.addEventListener('click', () => {
    if (state.translate.listening) {
      stopTranslateListening();
    } else {
      startTranslateListening();
    }
  });

  // Translate input — keep state in sync
  const translateInput = document.getElementById('translate-input');
  if (translateInput) {
    translateInput.addEventListener('input', () => {
      state.translate.inputText = translateInput.value;
      // No re-render on every keystroke — would lose focus. Just sync state.
    });
  }

  // Clear input
  const translateClear = document.getElementById('translate-clear');
  if (translateClear) translateClear.addEventListener('click', () => {
    state.translate.inputText = '';
    state.translate.result = null;
    state.translate.error = null;
    render();
  });

  // Translate button
  const translateGo = document.getElementById('translate-go');
  if (translateGo) translateGo.addEventListener('click', async () => {
    const input = document.getElementById('translate-input');
    const text = (input?.value || '').trim();
    if (!text) return;
    state.translate.inputText = text;
    state.translate.loading = true;
    state.translate.error   = null;
    state.translate.result  = null;
    render();
    try {
      const result = await translateText(text, state.translate.direction);
      state.translate.result  = result;
      state.translate.loading = false;
      render();
    } catch (err) {
      state.translate.loading = false;
      state.translate.error   = err.message || 'Translation failed';
      render();
    }
  });

  // Listen button on translation result
  const translateListen = document.getElementById('translate-listen');
  if (translateListen) translateListen.addEventListener('click', () => {
    const text = translateListen.dataset.trText;
    state.speaking = 'translate-result';
    render();
    speak(text, () => { state.speaking = null; render(); });
    setTimeout(() => { if (state.speaking === 'translate-result') { state.speaking = null; render(); } }, 6000);
  });

  // Pattern example play buttons
  document.querySelectorAll('[data-pex]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key     = btn.dataset.pex;
      const chinese = btn.dataset.pexChinese;
      state.speaking = key;
      render();
      speak(chinese, () => { state.speaking = null; render(); });
      setTimeout(() => { if (state.speaking === key) { state.speaking = null; render(); } }, 5000);
    });
  });

  // Speed toggle
  ['slow','normal','fast'].forEach(s => {
    const btn = document.getElementById('speed-' + s);
    if (btn) btn.addEventListener('click', () => { state.speed = s; render(); });
  });

  // Topic buttons (legacy pill bar — still works if shown elsewhere)
  document.querySelectorAll('[data-topic]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.topic   = btn.dataset.topic;
      state.mode    = 'study';
      state.tab     = 'words';
      state.flipped = {};
      state.speaking= null;
      state.sentenceBreakdownOpen = {};
      state.convo   = { convMode:'read', playingLine:null, shadowStep:0, shadowWaiting:false, gapAnswers:{}, bubbleRevealed:{}, breakdownOpen:{}, speakStep:0, speakStatus:'idle', speakHeard:'', speakAutoPlayed:false };
      render();
    });
  });

  // Topic cards (home screen) — enter the topic
  document.querySelectorAll('[data-topic-card]').forEach(card => {
    card.addEventListener('click', () => {
      state.topic        = card.dataset.topicCard;
      state.homeView     = false;
      state.currentRound = 1;
      state.mode         = 'study';
      state.tab          = 'words';
      state.flipped      = {};
      state.speaking     = null;
      state.sentenceBreakdownOpen = {};
      state.convo        = { convMode:'read', playingLine:null, shadowStep:0, shadowWaiting:false, gapAnswers:{}, bubbleRevealed:{}, breakdownOpen:{}, speakStep:0, speakStatus:'idle', speakHeard:'', speakAutoPlayed:false };
      window.scrollTo(0, 0);
      render();
    });
  });

  // Back to home button
  const backHomeBtn = document.getElementById('back-home-btn');
  if (backHomeBtn) backHomeBtn.addEventListener('click', () => {
    state.homeView = true;
    state.mode     = 'study';
    state.tab      = 'words';
    window.speechSynthesis.cancel();
    window.scrollTo(0, 0);
    render();
  });

  // Category filter dropdown
  const catSelect = document.getElementById('cat-filter-select');
  if (catSelect) catSelect.addEventListener('change', () => {
    state.selectedCategory = catSelect.value;
    window.scrollTo(0, 0);
    render();
  });

  // Round selector inside topic
  document.querySelectorAll('[data-round]').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = parseInt(btn.dataset.round);
      if (r === state.currentRound) return;
      state.currentRound = r;
      // Reset transient state for new round
      state.flipped  = {};
      state.speaking = null;
      state.sentenceBreakdownOpen = {};
      state.convo = { convMode:'read', playingLine:null, shadowStep:0, shadowWaiting:false, gapAnswers:{}, bubbleRevealed:{}, breakdownOpen:{}, speakStep:0, speakStatus:'idle', speakHeard:'', speakAutoPlayed:false };
      window.scrollTo(0, 0);
      render();
    });
  });

  // Sub-tabs
  const tabWords = document.getElementById('tab-words');
  const tabConvo = document.getElementById('tab-convo');
  if (tabWords) tabWords.addEventListener('click', () => { state.tab = 'words'; render(); });
  if (tabConvo) tabConvo.addEventListener('click', () => { state.tab = 'convo'; render(); });

  // Conversation: Play All / Stop
  const playAllBtn = document.getElementById('play-all-btn');
  if (playAllBtn) playAllBtn.addEventListener('click', () => {
    if (state.convo.playingLine !== null) {
      window.speechSynthesis.cancel();
      state.convo.playingLine = null;
      render();
    } else {
      const lines = CONVOS[state.topic].lines;
      playAllConvo(lines, 0);
    }
  });

  // Conversation: Gap mode toggle
  const gapBtn = document.getElementById('gap-mode-btn');
  if (gapBtn) gapBtn.addEventListener('click', () => {
    state.convo.convMode   = state.convo.convMode === 'gap' ? 'read' : 'gap';
    state.convo.gapAnswers = {};
    state.convo.breakdownOpen = {};
    render();
  });

  // Conversation: Shadow mode toggle
  const shadowBtn = document.getElementById('shadow-mode-btn');
  if (shadowBtn) shadowBtn.addEventListener('click', () => {
    state.convo.convMode     = state.convo.convMode === 'shadow' ? 'read' : 'shadow';
    state.convo.shadowStep   = 0;
    state.convo.shadowWaiting= false;
    window.speechSynthesis.cancel();
    state.convo.playingLine  = null;
    render();
  });

  // Shadow: play button
  const shadowPlay = document.getElementById('shadow-play');
  if (shadowPlay) shadowPlay.addEventListener('click', () => {
    const line = CONVOS[state.topic].lines[state.convo.shadowStep];
    state.convo.playingLine = state.convo.shadowStep;
    render();
    speak(line.c, () => {
      state.convo.playingLine  = null;
      state.convo.shadowWaiting= true;
      render();
    });
  });

  // Shadow: next button
  const shadowNext = document.getElementById('shadow-next');
  if (shadowNext) shadowNext.addEventListener('click', () => {
    const lines = CONVOS[state.topic].lines;
    window.speechSynthesis.cancel();
    state.convo.playingLine   = null;
    state.convo.shadowWaiting = false;
    if (state.convo.shadowStep >= lines.length - 1) {
      state.convo.shadowStep = 0;
    } else {
      state.convo.shadowStep++;
    }
    render();
  });

  // Conversation: Speak mode toggle
  const speakBtn = document.getElementById('speak-mode-btn');
  if (speakBtn) speakBtn.addEventListener('click', () => {
    stopListening();
    window.speechSynthesis.cancel();
    state.convo.convMode    = state.convo.convMode === 'speak' ? 'read' : 'speak';
    state.convo.speakStep   = 0;
    state.convo.speakStatus = 'idle';
    state.convo.speakHeard  = '';
    state.convo.playingLine = null;
    render();
  });

  // Speak: mic button — toggles start/stop
  const micBtn = document.getElementById('mic-btn');
  if (micBtn) micBtn.addEventListener('click', () => {
    if (state.convo.speakStatus === 'listening') {
      finishListening();   // gracefully stop and process
    } else {
      startListening();
    }
  });

  // Speak: dedicated stop button
  const speakStopBtn = document.getElementById('speak-stop-btn');
  if (speakStopBtn) speakStopBtn.addEventListener('click', () => {
    finishListening();
  });

  // Speak: listen button (other speaker's turn)
  const speakListenBtn = document.getElementById('speak-listen-btn');
  if (speakListenBtn) speakListenBtn.addEventListener('click', () => {
    const line = CONVOS[state.topic].lines[state.convo.speakStep];
    state.convo.playingLine = state.convo.speakStep;
    render();
    speakAs(line.c, line.u, () => { state.convo.playingLine = null; render(); });
  });

  // Speak: next button
  const speakNext = document.getElementById('speak-next');
  if (speakNext) speakNext.addEventListener('click', () => {
    const lines = CONVOS[state.topic].lines;
    stopListening();
    window.speechSynthesis.cancel();
    state.convo.playingLine = null;
    state.convo.speakStatus = 'idle';
    state.convo.speakHeard  = '';
    if (state.convo.speakStep >= lines.length - 1) {
      state.convo.speakStep = 0;
    } else {
      state.convo.speakStep++;
    }
    render();
  });

  // Speak: retry button
  const speakRetry = document.getElementById('speak-retry');
  if (speakRetry) speakRetry.addEventListener('click', () => {
    state.convo.speakStatus = 'idle';
    state.convo.speakHeard  = '';
    render();
  });

  // Speak: skip button
  const speakSkip = document.getElementById('speak-skip');
  if (speakSkip) speakSkip.addEventListener('click', () => {
    const lines = CONVOS[state.topic].lines;
    state.convo.speakStatus = 'idle';
    state.convo.speakHeard  = '';
    if (state.convo.speakStep >= lines.length - 1) {
      state.convo.speakStep = 0;
    } else {
      state.convo.speakStep++;
    }
    render();
  });

  // Breakdown toggle
  document.querySelectorAll('[data-breakdown]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.breakdown);
      state.convo.breakdownOpen[i] = !state.convo.breakdownOpen[i];
      render();
    });
  });

  // Bubble English reveal (tap bubble)
  document.querySelectorAll('[data-reveal]').forEach(bubble => {
    bubble.addEventListener('click', e => {
      if (e.target.closest('[data-bubble]')) return; // don't fire when tapping play btn
      const i = parseInt(bubble.dataset.reveal);
      state.convo.bubbleRevealed[i] = !state.convo.bubbleRevealed[i];
      render();
    });
  });

  // Bubble play buttons
  document.querySelectorAll('[data-bubble]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.bubble);
      const line = CONVOS[state.topic].lines[i];
      state.convo.playingLine = i;
      render();
      speakAs(line.c, line.u, () => { state.convo.playingLine = null; render(); });
      setTimeout(() => { if (state.convo.playingLine === i) { state.convo.playingLine = null; render(); } }, 6000);
    });
  });

  // Gap mode answer buttons
  document.querySelectorAll('[data-gap-line]').forEach(btn => {
    btn.addEventListener('click', () => {
      const lineIdx = parseInt(btn.dataset.gapLine);
      const chosen  = btn.dataset.gapAns;
      state.convo.gapAnswers[lineIdx] = chosen;
      const correct = chosen === CONVOS[state.topic].lines[lineIdx].c;
      if (correct) speak(chosen);
      render();
    });
  });

  // Mode toggle
  const modeBtn = document.getElementById('mode-toggle');
  if (modeBtn) modeBtn.addEventListener('click', () => {
    state.mode = state.mode === 'study' ? 'quiz' : 'study';
    if (state.mode === 'quiz') state.quiz = getQuizInitState(lesson.words);
    render();
  });

  // Flip cards
  document.querySelectorAll('[data-card]').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('[data-speak]')) return;
      const i = parseInt(card.dataset.card);
      state.flipped[i] = !state.flipped[i];
      render();
    });
  });

  // Speak buttons
  document.querySelectorAll('[data-speak]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.speak);
      const word = lesson.words[i];
      state.speaking = i;
      render();
      speak(word.c, () => { state.speaking = null; render(); });
      setTimeout(() => { if (state.speaking === i) { state.speaking = null; render(); } }, 4000);
    });
  });

  // Sentence play buttons
  document.querySelectorAll('[data-sent]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.sent);
      const sentence = SENTENCES[state.topic][i];
      state.speaking = 'sent-' + i;
      render();
      speak(sentence.c, () => { state.speaking = null; render(); });
      setTimeout(() => { if (state.speaking === 'sent-' + i) { state.speaking = null; render(); } }, 6000);
    });
  });

  // Sentence breakdown toggle
  document.querySelectorAll('[data-sent-bd]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.sentBd);
      state.sentenceBreakdownOpen[i] = !state.sentenceBreakdownOpen[i];
      render();
    });
  });

  // Quiz listen
  const ql = document.getElementById('quiz-listen');
  if (ql && state.quiz) {
    ql.addEventListener('click', () => speak(state.quiz.queue[state.quiz.idx].c));
  }

  // Quiz choices
  if (state.quiz && !state.quiz.done) {
    document.querySelectorAll('[data-choice]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.quiz.selected) return;
        const chosen = btn.dataset.choice;
        const cw = state.quiz.queue[state.quiz.idx];
        const correct = chosen === cw.c;
        speak(cw.c);
        state.quiz.selected = chosen;
        if (correct) state.quiz.score++;
        render();
        setTimeout(() => {
          const next = state.quiz.idx + 1;
          if (next >= state.quiz.queue.length) {
            state.quiz.done = true;
          } else {
            state.quiz.idx = next;
            state.quiz.selected = null;
            state.quiz.choices = buildChoices(state.quiz.queue[next], lesson.words);
          }
          render();
        }, 950);
      });
    });
  }

  // Quiz back
  const qb = document.getElementById('quiz-back');
  if (qb) qb.addEventListener('click', () => { state.mode = 'study'; render(); });
}

// ── Init ──────────────────────────────────────────────────────────────────────
(async function init() {
  render(); // first paint immediately

  const voices = await loadVoices();
  const zhVoices = voices.filter(v => v.lang === 'zh-HK' || v.lang === 'zh-TW' || v.lang.startsWith('zh'));
  const hk = voices.find(v => v.lang === 'zh-HK');
  const tw = voices.find(v => v.lang === 'zh-TW');
  const zh = zhVoices[0];
  const count = zhVoices.length;
  const dualNote = count >= 2 ? ` · ${count} voices found — dual speaker active` : ` · 1 voice found — using pitch to differentiate speakers`;
  if (hk)      state.voiceInfo = { status:'hk',    label:'Cantonese (zh-HK) ready ✓' + dualNote, name: hk.name };
  else if (tw) state.voiceInfo = { status:'other', label:'Chinese (zh-TW) in use' + dualNote,     name: tw.name };
  else if (zh) state.voiceInfo = { status:'other', label:'Chinese voice in use' + dualNote,        name: zh.name };
  else         state.voiceInfo = { status:'none',  label:'No Chinese voice found — install one via Android Settings → General Management → Language & Input → Text-to-Speech → Google TTS → Install voice data → Chinese (Hong Kong)', name: '' };

  render(); // re-render with voice info
})();
</script>
