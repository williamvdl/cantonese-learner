<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1A1815">
<link rel="manifest" href="./manifest.json">

<!-- Font system: Source Serif 4 (English serif headers), Inter (English UI), Noto Serif TC (Chinese) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>廣東話 Cantonese Learner</title>

<!-- Application styles -->
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app"></div>

<!-- Application scripts. ORDER MATTERS: data.js defines store/storage used by
     app.js; app.js defines state/logic used by render.js. Do not reorder. -->
<script src="./data.js"></script>
<script src="./app.js"></script>
<script src="./render.js"></script>

<script>
// ── Service Worker Registration ───────────────────────────────────────────────
// Registers sw.js so the app works offline and can be installed to home screen.
// The 'serviceWorker' in navigator check means this silently does nothing
// in browsers that don't support it (old browsers, file:// local testing).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('[SW] Registered'))
      .catch(err => console.warn('[SW] Registration failed:', err));
  });
}
</script>
</body>
</html>
